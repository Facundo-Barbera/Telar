name: Nightly iOS build

on:
  push:
    tags:
      - "ios-nightly-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ios
  cancel-in-progress: false

jobs:
  testflight:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    # 45 covered archive → export → upload. The external-group step then waits
    # up to 30 minutes for App Store Connect to process the build before it
    # can be added and submitted, so the ceiling is the old one plus that wait.
    timeout-minutes: 80
    env:
      # Named rather than inherited: it must be a release Xcode (App Store
      # Connect refuses a beta's uploads), never the Command Line Tools.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      # Same rule, same enforcement as nightly-desktop.yml: a nightly installs
      # itself on real phones, so it builds from main and nothing else.
      - name: Refuse to build a tag that is not on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Releases come from main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - name: Confirm the release Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          # A beta's build number ends in a letter (27A5252f); a release's does
          # not (27A266a is an RC, which Apple accepts). Refuse the beta here,
          # where it costs seconds, not after a ten-minute archive.
          BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$DEVELOPER_DIR/../Info.plist" | grep -qi beta; then
            echo "::error::$DEVELOPER_DIR is a beta Xcode (build $BUILD); App Store Connect refuses its uploads."
            exit 1
          fi

      - name: Materialize the App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/apple_api_key.p8"

      # A REAL Apple Distribution certificate, not cloud signing: Apple's
      # upload validator refuses cloud-managed signatures outright (90035,
      # measured twice on 2026-09-01 — beta and release Xcode alike — while
      # the same archive re-signed from a keychain cert validated clean).
      # Same temp-keychain dance as nightly-desktop.yml.
      - name: Import the distribution certificate into a temporary keychain
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$IOS_DIST_CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/dist.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user > "$RUNNER_TEMP/keychain-search-list.txt"
          # Trim the wrapping quotes and the indentation, and NOTHING else. The
          # `s/[" ]//g` this replaces could not tell those spaces from a space
          # inside a path, so `/Users/Ada Lovelace/…` came back as a path that
          # does not exist and was dropped from the search list without a word.
          IFS=$'\n' read -rd '' -a EXISTING < <(sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//' "$RUNNER_TEMP/keychain-search-list.txt") || true
          # A COUNT is never unbound, so this line is safe on the very empty
          # array the next one is guarded against. `warning` and not `error`:
          # searching only the signing keychain is what this step wants anyway,
          # so aborting would turn a survivable state into a dead nightly — but
          # "the login keychain is gone" is worth saying out loud.
          if [ "${#EXISTING[@]}" -eq 0 ]; then echo "::warning::the user keychain search list came back empty; setting it to the signing keychain alone"; fi
          # `${EXISTING[@]+…}` because bash 3.2 — which is what the macOS runner
          # images report as their `bash`, and a `run:` block takes its shell
          # from PATH — treats an expansion of an EMPTY array under `set -u` as
          # an unbound variable and kills the step (#808, #829). With the array
          # filled the guard passes byte-identical arguments.
          security list-keychains -d user -s "$KEYCHAIN" ${EXISTING[@]+"${EXISTING[@]}"}
          rm -f "$RUNNER_TEMP/dist.p12"

      # nightly.sh is the whole pipeline (archive → export → upload → offer to
      # the external group); the workflow only supplies credentials and the
      # runner's Xcode. The minute-stamp build number is minted inside the
      # script, so a re-run after a dead upload gets a fresh, acceptable
      # number, and the script hands that same number to
      # testflight-external.sh itself — one step, nothing passed through here.
      - name: Archive, upload to TestFlight, and offer to the external group
        env:
          TELAR_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          TELAR_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          TELAR_ASC_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
        run: apps/ios/nightly.sh

      - name: Clean up the API key and keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/keychain-search-list.txt" ]; then
            python3 - <<'PYTHON'
          import os, pathlib, shlex, subprocess
          saved = pathlib.Path(os.environ["RUNNER_TEMP"]) / "keychain-search-list.txt"
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *shlex.split(saved.read_text())], check=True)
          PYTHON
          fi
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple_api_key.p8" "$RUNNER_TEMP/keychain-search-list.txt" 2>/dev/null || true
