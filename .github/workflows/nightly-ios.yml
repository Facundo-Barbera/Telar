name: Nightly iOS build

# The phone's nightly channel: TestFlight internal testing. Same shape as
# nightly-desktop.yml — the tag is the deliberate act, the workflow is the
# consequence — and the same rule: a nightly installs itself on real devices
# (TestFlight auto-updates internal testers), so it builds from what the tag
# points at on the trunk, not from a branch someone happened to have.
#
# `ios-nightly-*` only: the desktop nightly owns `v*-nightly.*`, and one tag
# pattern per artifact keeps the two from racing a shared version scheme.
#
# SIGNING TAKES TWO CREDENTIALS, not one, and they do different jobs:
#
#   The App Store Connect API key (APPLE_API_*) authorises
#   -allowProvisioningUpdates to fetch the provisioning profile, and
#   authorises the upload. It is the SAME key the desktop release uses to
#   notarize — one credential, both platforms (it needs the App Manager role
#   for build uploads; notarization alone tolerates less).
#
#   A REAL Apple Distribution certificate (IOS_DIST_CERT_*) does the signing,
#   imported into a temporary keychain below. This is NOT cloud-managed
#   signing: Apple's upload validator refuses cloud-managed signatures
#   outright (90035, measured twice on 2026-09-01), while the same archive
#   re-signed from a keychain cert validated clean.
#
# This paragraph said the opposite until 2026-09-20 — "signing is cloud-
# managed, there is no cert .p12 to import" — describing the workflow as it
# was before that measurement, while the step below imported a .p12 anyway.
# It sent at least one reader to the wrong conclusion about #757. Said
# plainly here because a header that contradicts its own steps is worse than
# no header.
#
# HOSTED (macos-latest) since 2026-09-20, with the rest of CI. It ran on the
# maintainer's Mac mini from 2026-09-11, when the hosted lane stopped starting
# jobs for billing and the Mac had gained a release Xcode; that is over.
# `DEVELOPER_DIR` rather than `xcode-select` outlived the move — every script
# here honours the variable, and naming the Xcode beats inheriting whatever
# `xcode-select` points at. See docs/operations/mac-mini-runner-plan-2026-09-11.md.
on:
  push:
    tags:
      - "ios-nightly-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ios
  cancel-in-progress: false

jobs:
  testflight:
    # Only trusted release triggers use the personal Mac.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    # NEEDS macOS, NOT THIS PARTICULAR MAC — moved to hosted 2026-09-20 with
    # the rest of CI. Signing here is cloud-managed (no .p12 to import), so
    # nothing about credentials had to change.
    #
    # ⚠ KNOWN RED ON ARRIVAL, and moving it is not what broke it. Two separate
    # faults, both pre-dating the move:
    #
    #   #757 — `exportArchive Copy failed`. The archive succeeds and the
    #          EXPORT fails. Four consecutive failures ON THE MAC from
    #          2026-09-19T03:45Z; last green 2026-09-18T21:35Z. Nobody was
    #          told, because nothing notified on failure.
    #   #758 — the ARCHIVE fails on a hosted runner: SessionView.swift's body
    #          exceeds the Swift type checker's time budget. A THRESHOLD, not
    #          a clean break — the maintainer's Mac finishes inside it and a
    #          hosted runner does not, so a re-run may pass. Do not read a
    #          green retry as a fix.
    #
    # So this was already failing before it moved, and it lost nothing that
    # worked. #758 is what gets it BUILDING here; #757 is what gets it
    # PUBLISHING. Fixing either alone does not produce a nightly.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # THE ONE XCODE ON THIS MAC, and it must be a release build: App Store
      # Connect refuses uploads from a beta. A missing app fails the first
      # xcodebuild loudly rather than falling back to whatever xcode-select
      # names (the Command Line Tools, which cannot archive an iOS app).
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      # Same rule, same enforcement as nightly-desktop.yml: a nightly installs
      # itself on real phones, so it builds from main and nothing else.
      - name: Refuse to build a tag that is not on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Releases come from main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - name: Confirm the release Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          # A beta's build number ends in a letter (27A5252f); a release's does
          # not (27A266a is an RC, which Apple accepts). Refuse the beta here,
          # where it costs seconds, not after a ten-minute archive.
          BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$DEVELOPER_DIR/../Info.plist" | grep -qi beta; then
            echo "::error::$DEVELOPER_DIR is a beta Xcode (build $BUILD); App Store Connect refuses its uploads."
            exit 1
          fi

      - name: Materialize the App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/apple_api_key.p8"

      # A REAL Apple Distribution certificate, not cloud signing: Apple's
      # upload validator refuses cloud-managed signatures outright (90035,
      # measured twice on 2026-09-01 — beta and release Xcode alike — while
      # the same archive re-signed from a keychain cert validated clean).
      # Same temp-keychain dance as nightly-desktop.yml.
      - name: Import the distribution certificate into a temporary keychain
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$IOS_DIST_CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/dist.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN" >/dev/null
          IFS=$'\n' read -rd '' -a EXISTING < <(security list-keychains -d user | sed 's/[" ]//g') || true
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/dist.p12"

      # nightly.sh is the whole pipeline (archive → export → upload); the
      # workflow only supplies credentials and the runner's Xcode. The
      # minute-stamp build number is minted inside the script, so a re-run
      # after a dead upload gets a fresh, acceptable number.
      - name: Archive and upload to TestFlight
        env:
          TELAR_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          TELAR_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          TELAR_ASC_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
        run: apps/ios/nightly.sh

      - name: Clean up the API key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple_api_key.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
