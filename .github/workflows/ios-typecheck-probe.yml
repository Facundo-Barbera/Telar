name: iOS type-check probe

# ════════════════════════════════════════════════════════════════════════════
# THIS IS A PROBE. IT ARCHIVES, PRINTS NUMBERS, AND STOPS.
#
# It exists to turn #758 — "SessionView's body is too complex to type-check on
# a slower machine" — into a figure instead of an opinion. The whole point of
# that issue is that the answer DEPENDS ON THE MACHINE: the maintainer's Mac
# finishes inside the type checker's budget and a GitHub-hosted runner does
# not. So the measurement has to happen HERE, on `macos-latest`, or it
# measures nothing.
#
# The instrument is two frontend flags fed through OTHER_SWIFT_FLAGS:
#
#     -Xfrontend -warn-long-expression-type-checking=500
#     -Xfrontend -warn-long-function-bodies=500
#
# Every expression and every function body that takes longer than 500 ms then
# warns with its own duration, and this job sorts those durations and prints
# the worst. Before the fix that is the size of the problem; after it, the
# headroom.
#
# WHAT IT DELIBERATELY DOES NOT DO, so nobody later "completes" it:
#   - it does not sign (CODE_SIGNING_ALLOWED=NO, as in the probe that found
#     the bug: run 35490217749)
#   - it does not export an IPA
#   - it does not upload to App Store Connect / TestFlight
#   - it does not run a simulator, and it has no step that outlives the job
#
# It is given no secrets at all, so publishing is not merely omitted here —
# there is nothing to publish with.
#
# TEMPORARY: delete with the branch. The measurement it produces belongs in
# the pull request, not in the repository.
# ════════════════════════════════════════════════════════════════════════════

# A branch push, for the same reason hosted-signing-probe.yml used one:
# `workflow_dispatch` only offers workflows that already exist on the DEFAULT
# branch, and a probe that has to merge before it can answer the question is
# no use for deciding what to merge. Scoped to the one branch.
on:
  push:
    branches: ["telar/758-sessionview-body-bajo-el-presupuesto-b7a3a0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-typecheck-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: "macos-latest: how long does SessionView take to type-check"
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain the numbers come from
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          echo "runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true

      # THE ARCHIVE THAT FAILS IN #758, plus the two flags. Not `-typecheck`
      # on the file alone: the failure is a Release, whole-module archive of
      # the real project, and a cheaper instrument would be measuring a
      # different compile than the one that breaks.
      #
      # `|| true` because BEFORE the fix this step is EXPECTED to fail — the
      # compiler gives up on the expression and xcodebuild exits 65. The log
      # is the deliverable either way; the real exit status is re-asserted at
      # the end of the step so a genuinely broken build is still red.
      - name: Archive with the type-checker timers on
        run: |
          set -uo pipefail
          cd apps/ios
          set +e
          xcodebuild archive \
            -project TelarMobile.xcodeproj -scheme TelarMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TelarMobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=500 -Xfrontend -warn-long-function-bodies=500' \
            archive 2>&1 | tee "$RUNNER_TEMP/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "xcodebuild exit status: $STATUS"
          echo "ARCHIVE_STATUS=$STATUS" >> "$GITHUB_ENV"

      # THE NUMBERS. Sorted descending, because the question is never "did
      # anything warn" but "what is the worst one, and how far is it from the
      # bar". SessionView is pulled out on its own so the before/after
      # comparison is about the file the issue names.
      - name: Report the slowest expressions and function bodies
        if: always()
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"

          echo "── every 'too complex to type-check' error ────────────────────"
          /usr/bin/grep -a 'unable to type-check this expression' "$LOG" || echo "(none)"

          # One line per distinct warning, path stripped to the file name, as
          # "<ms>\t<warning>". Xcode repeats a warning once per emitted target
          # pass, hence the sort -u.
          /usr/bin/grep -a 'ms to type-check' "$LOG" \
            | sed -E 's#^[^ ]*/##' \
            | sort -u \
            | awk 'match($0, /took [0-9]+ms to type-check/) {
                     ms = substr($0, RSTART + 5); sub(/ms.*/, "", ms);
                     print ms "\t" $0
                   }' \
            | sort -rn > "$RUNNER_TEMP/slow.tsv" || true

          echo
          echo "── slowest, whole project (top 25) ───────────────────────────"
          if [ -s "$RUNNER_TEMP/slow.tsv" ]; then head -25 "$RUNNER_TEMP/slow.tsv"; else
            echo "(nothing in the whole app took longer than 500 ms)"; fi

          echo
          echo "── SessionView.swift only ────────────────────────────────────"
          /usr/bin/grep -a 'SessionView\.swift' "$RUNNER_TEMP/slow.tsv" \
            || echo "(no warnings from SessionView.swift — everything in it is under 500 ms)"

          echo
          echo "── SessionView.swift, worst single figure ────────────────────"
          WORST=$(/usr/bin/grep -a 'SessionView\.swift' "$RUNNER_TEMP/slow.tsv" | head -1 | cut -f1)
          echo "${WORST:-0} ms (bar: 500 ms; 0 means nothing in the file reached it)"

      # A probe that goes green on a failed archive teaches people to ignore
      # it. The log has been printed by now, so failing here loses nothing.
      - name: Fail if the archive failed
        if: always()
        run: |
          set -euo pipefail
          if [ "${ARCHIVE_STATUS:-1}" != "0" ]; then
            echo "::error::xcodebuild exited ${ARCHIVE_STATUS:-1} — see the log above"
            exit 1
          fi
          APP="$RUNNER_TEMP/TelarMobile.xcarchive/Products/Applications/TelarMobile.app"
          [ -d "$APP" ] || { echo "::error::archive exited 0 but produced no .app"; exit 1; }
          echo "archived on a hosted runner"
