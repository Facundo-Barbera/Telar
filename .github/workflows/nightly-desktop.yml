name: Nightly channel build

# On demand, not on a timer. Publishes straight to R2 under the "nightly"
# channel and cuts no GitHub Release — that page is for betas, and a stream of
# dev builds would bury them. The channel keeps its name because the version
# scheme and the update feed (nightly-mac.yml) are keyed on it; only the
# cadence is manual.
#
# There is deliberately no "has main moved since the last build?" gate: that
# only ever earned its keep against an idle daily cron. Dispatching by hand and
# silently getting nothing back would be a worse failure, and rebuilding the
# same commit is exactly what you want after a run dies halfway.
#
# ALWAYS origin/main, AND NOT A CHOICE — the same rule the release workflow now
# states, applied here for a reason of its own. A nightly is not a throwaway:
# it is published to the update channel and INSTALLED AUTOMATICALLY by every app
# configured for it (electron-updater checks on launch and every six hours, and
# auto-downloads). A nightly built from a branch therefore ships unmerged code
# to real machines, silently, which is a stronger argument for main-only than
# the release workflow has.
#
# This input existed and was used exactly once, on 2026-08-05, to build a
# nightly from `fix/ultra-hardening` — which is what made the hazard concrete
# rather than theoretical. Landing on main is now the only way to ship.
#
# AUTOMATIC ON A TAG, and the tag is the trigger rather than a push to main
# because not every merge deserves a build that installs itself on people's
# machines. Tagging is the deliberate act; the workflow is the consequence.
#
# `v*-nightly.*` only — the beta workflow owns `v*-beta.*`. Two workflows
# watching one pattern would both fire and race for the same version number.
on:
  push:
    tags:
      - "v*-nightly.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  nightly:
    # Only trusted release triggers use the personal Mac; PR CI stays hosted.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, telar-nightly]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # build-desktop.sh resolves --ref against full origin history, and
          # set-desktop-version.mjs counts existing tags to pick the next
          # nightly number — both need an unshallow clone with tags.
          fetch-depth: 0

      # THE MAIN-ONLY RULE, ENFORCED RATHER THAN DOCUMENTED. Removing the `ref`
      # input stops a build being AIMED off main; it does not stop a tag being
      # PLACED off main, and a tag push is now a trigger. Without this a tag on
      # any branch would publish to the update channel and install itself.
      #
      # Ancestry, not equality: the tagged commit must be reachable from
      # origin/main, so tagging an older main commit stays legal while tagging
      # an unmerged branch does not.
      - name: Refuse to build a tag that is not on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Releases come from main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - uses: oven-sh/setup-bun@v2

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          # Save the exact search list before changing this persistent Mac.
          security list-keychains -d user > "$RUNNER_TEMP/keychain-search-list.txt"
          KEYCHAIN="$RUNNER_TEMP/signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$MACOS_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend so electron-builder's cert auto-discovery finds it first.
          IFS=$'\n' read -rd '' -a EXISTING < <(security list-keychains -d user | sed 's/[" ]//g') || true
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"

          rm -f "$CERT_PATH"

      # build-desktop.sh --publish-r2 uploads through the aws CLI, which the
      # macOS runner image does not reliably ship. Its preflight fails fast
      # rather than mid-build, but only after a long build has already run.
      - name: Ensure the aws CLI is on PATH
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          aws --version

      # SIGNED BUT NOT NOTARIZED, and that is the single biggest cost decision
      # in this file. Measured on run 31059334911: the whole build was 376s, of
      # which SIGNING PLUS NOTARIZATION WAS 214s — 57%, nearly all of it spent
      # waiting on Apple's notary service. macOS runners bill at a 10x
      # multiplier, so that idle wait alone costs ~35 billable minutes per
      # nightly.
      #
      # build-desktop.sh takes no notarize flag: electron-builder notarizes iff
      # APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER are present. Omitting
      # them here is how a nightly opts out. The Developer ID SIGNATURE is
      # unaffected — that comes from the keychain cert imported above, and
      # Squirrel verifies the signature, not the notarization, when it swaps an
      # update into an already-installed app.
      #
      # THE EDGE THIS BUYS, stated so nobody rediscovers it: a nightly ZIP
      # downloaded and opened BY HAND carries the quarantine bit and Gatekeeper
      # will refuse it. Arriving over the update channel it does not, which is
      # the only way anyone reaches a nightly. If a nightly ever needs to be
      # handed to someone as a file, notarize that one by restoring the three
      # env vars. Betas stay notarized: they ARE downloaded by hand.
      - name: Build, sign, and publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          UPDATE_PROXY_URL: ${{ secrets.UPDATE_PROXY_URL }}
          UPDATE_PROXY_KEY: ${{ secrets.UPDATE_PROXY_KEY }}
        run: |
          # A TAG NAMES A COMMIT, so a tag-triggered run builds THAT commit and
          # not the tip — main may already have moved past it, and shipping the
          # tip under a tag's name would make the tag a lie. The ancestry guard
          # above has already established the commit is on main, so this is
          # still main-only. A manual dispatch has no tag and builds the tip.
          REF="origin/main"
          VERSION_ARG=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REF="$GITHUB_SHA"
            # The tag already named the version; set-desktop-version.mjs would
            # otherwise COUNT this tag and derive the next one, publishing under
            # a name nobody chose.
            VERSION_ARG=(--version "${GITHUB_REF_NAME#v}")
          fi
          # ZIP ONLY. electron-updater consumes the zip; the DMG exists for a
          # human to download and drag, and a nightly cuts no GitHub Release for
          # anyone to download it from. Measured at ~43s for the pair, most of
          # it the DMG (it also pulls down a dmgbuild bundle first).
          bash scripts/build-desktop.sh --ref "$REF" --targets zip \
            --channel nightly "${VERSION_ARG[@]}" --publish-r2

      # Tags the commit that was actually built. That used to be a defence
      # against a build of an OLDER ref mislabelling the tip; with main-only
      # builds the two coincide, and it is resolved rather than assumed anyway
      # so the tag names the exact commit this run compiled. The tag is also
      # what set-desktop-version.mjs counts to pick the next nightly number.
      # ONLY ON A MANUAL DISPATCH. When a tag triggered this run the tag already
      # exists — that is what started it — and re-creating it would fail the
      # push, or worse, mint a SECOND tag at a different version because
      # set-desktop-version.mjs counts tags to pick the next number.
      - name: Tag the nightly version (no GitHub Release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="$(cat apps/desktop/release/from-origin/VERSION)"
          SHA="$(git rev-parse --verify "origin/main^{commit}")"
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"

      - name: Clean up temporary keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/keychain-search-list.txt" ]; then
            python3 - <<'PYTHON'
          import os, pathlib, shlex, subprocess
          saved = pathlib.Path(os.environ["RUNNER_TEMP"]) / "keychain-search-list.txt"
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *shlex.split(saved.read_text())], check=True)
          PYTHON
          fi
          security delete-keychain "$RUNNER_TEMP/signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/apple_api_key.p8" "$RUNNER_TEMP/keychain-search-list.txt"
