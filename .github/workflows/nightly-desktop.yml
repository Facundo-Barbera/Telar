name: Nightly desktop build

# Unattended: runs daily and publishes straight to R2 under the "nightly"
# channel, no GitHub Release (that would spam the releases page). Skips
# entirely if origin/main hasn't moved since the last nightly tag, so an
# idle repo doesn't burn macOS runner minutes for a no-op rebuild.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  nightly:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-desktop.sh resolves --ref against full origin history; also needed for tag diffing

      - name: Check whether main has moved since the last nightly tag
        id: gate
        run: |
          set -euo pipefail
          git fetch --prune origin
          LAST_NIGHTLY_SHA="$(git rev-list --tags='v*-nightly.*' --max-count=1 2>/dev/null || true)"
          HEAD_SHA="$(git rev-parse origin/main)"
          if [ -n "$LAST_NIGHTLY_SHA" ] && [ "$LAST_NIGHTLY_SHA" = "$HEAD_SHA" ]; then
            echo "origin/main unchanged since the last nightly tag ($HEAD_SHA) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.skip != 'true'

      - name: Import Developer ID certificate into a temporary keychain
        if: steps.gate.outputs.skip != 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$MACOS_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend so electron-builder's cert auto-discovery finds it first.
          IFS=$'\n' read -rd '' -a EXISTING < <(security list-keychains -d user | sed 's/[" ]//g') || true
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"

          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key
        if: steps.gate.outputs.skip != 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/apple_api_key.p8"

      # build-desktop.sh --publish-r2 uploads through the aws CLI, which the
      # macOS runner image does not reliably ship. Its preflight fails fast
      # rather than mid-build, but only after a long build has already run.
      - name: Ensure the aws CLI is on PATH
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          aws --version

      - name: Build, sign, notarize, and publish to R2
        if: steps.gate.outputs.skip != 'true'
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          UPDATE_PROXY_URL: ${{ secrets.UPDATE_PROXY_URL }}
          UPDATE_PROXY_KEY: ${{ secrets.UPDATE_PROXY_KEY }}
        run: |
          bash scripts/build-desktop.sh --ref origin/main --targets zip,dmg \
            --channel nightly --publish-r2

      - name: Tag the nightly version (no GitHub Release)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="$(cat apps/desktop/release/from-origin/VERSION)"
          git tag "v$VERSION" origin/main
          git push origin "v$VERSION"

      - name: Clean up temporary keychain
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple_api_key.p8" 2>/dev/null || true
