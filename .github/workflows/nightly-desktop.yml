name: Nightly channel build

# On demand, not on a timer. Publishes straight to R2 under the "nightly"
# channel and cuts no GitHub Release — that page is for betas, and a stream of
# dev builds would bury them. The channel keeps its name because the version
# scheme and the update feed (nightly-mac.yml) are keyed on it; only the
# cadence is manual.
#
# There is deliberately no "has main moved since the last build?" gate: that
# only ever earned its keep against an idle daily cron. Dispatching by hand and
# silently getting nothing back would be a worse failure, and rebuilding the
# same commit is exactly what you want after a run dies halfway.
#
# ALWAYS origin/main, AND NOT A CHOICE — the same rule the release workflow now
# states, applied here for a reason of its own. A nightly is not a throwaway:
# it is published to the update channel and INSTALLED AUTOMATICALLY by every app
# configured for it (electron-updater checks on launch and every six hours, and
# auto-downloads). A nightly built from a branch therefore ships unmerged code
# to real machines, silently, which is a stronger argument for main-only than
# the release workflow has.
#
# This input existed and was used exactly once, on 2026-08-05, to build a
# nightly from `fix/ultra-hardening` — which is what made the hazard concrete
# rather than theoretical. Landing on main is now the only way to ship.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # build-desktop.sh resolves --ref against full origin history, and
          # set-desktop-version.mjs counts existing tags to pick the next
          # nightly number — both need an unshallow clone with tags.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$MACOS_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend so electron-builder's cert auto-discovery finds it first.
          IFS=$'\n' read -rd '' -a EXISTING < <(security list-keychains -d user | sed 's/[" ]//g') || true
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"

          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/apple_api_key.p8"

      # build-desktop.sh --publish-r2 uploads through the aws CLI, which the
      # macOS runner image does not reliably ship. Its preflight fails fast
      # rather than mid-build, but only after a long build has already run.
      - name: Ensure the aws CLI is on PATH
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          aws --version

      - name: Build, sign, notarize, and publish to R2
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          UPDATE_PROXY_URL: ${{ secrets.UPDATE_PROXY_URL }}
          UPDATE_PROXY_KEY: ${{ secrets.UPDATE_PROXY_KEY }}
        run: |
          bash scripts/build-desktop.sh --ref origin/main --targets zip,dmg \
            --channel nightly --publish-r2

      # Tags the commit that was actually built. That used to be a defence
      # against a build of an OLDER ref mislabelling the tip; with main-only
      # builds the two coincide, and it is resolved rather than assumed anyway
      # so the tag names the exact commit this run compiled. The tag is also
      # what set-desktop-version.mjs counts to pick the next nightly number.
      - name: Tag the nightly version (no GitHub Release)
        run: |
          set -euo pipefail
          VERSION="$(cat apps/desktop/release/from-origin/VERSION)"
          SHA="$(git rev-parse --verify "origin/main^{commit}")"
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"

      - name: Clean up temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple_api_key.p8" 2>/dev/null || true
