name: Deploy personal push relay
on:
  workflow_dispatch:
  push:
    branches: ['telar/push-relay-*']
    paths: ['workers/push-relay/**', '.github/workflows/deploy-push-relay.yml']
permissions:
  contents: read
concurrency:
  group: telar-push-relay
  cancel-in-progress: false
jobs:
  deploy:
    # On the Mac mini: a node script calling Cloudflare needs no Linux, and the
    # hosted lane stopped starting jobs (billing) on 2026-09-07.
    # NEVER NEEDED A MAC. This is `actions/setup-node` and `node`; it ran on the
    # owner's Mac only because 89b65885 moved every workflow there together on
    # 2026-09-11, when the hosted lane stopped starting jobs for billing.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test workers/push-relay/worker.test.mjs
      - name: Deploy on existing Free plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELAR_APNS_KEY_P8_BASE64: ${{ secrets.TELAR_APNS_KEY_P8_BASE64 }}
          TELAR_APNS_KEY_ID: ${{ secrets.TELAR_APNS_KEY_ID }}
          TELAR_APNS_TEAM_ID: ${{ secrets.TELAR_APNS_TEAM_ID }}
          TELAR_PUSH_HOSTS: ${{ vars.TELAR_PUSH_HOSTS }}
        run: node workers/push-relay/deploy.mjs
