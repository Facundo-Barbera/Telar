name: Release desktop app

# Manual only — signing + publishing a release should never happen on an
# ordinary push. The release tag is derived from the beta version that
# build-desktop.sh computes (via set-desktop-version.mjs), not typed by hand.
#
# ALWAYS origin/main, AND NOT A CHOICE. This used to take a `ref` input
# defaulting to origin/main, which made "which commit is this release?"
# question with a per-run answer — a signed, notarized, publicly downloadable
# artifact could be cut from any branch, including one that had never been
# reviewed or merged. A released build must be reproducible from the trunk by
# anyone reading the repo, and an input that is right by default is still an
# input that can be wrong once.
#
# Landing on main is now the ONLY way to ship. That is the intended cost: it
# makes merge the gate, rather than leaving the gate at whoever dispatches the
# workflow. Note that the branch this workflow FILE is read from is still
# selectable (that is how workflow_dispatch works) — but what it BUILDS is not.
#
# AUTOMATIC ON A BETA TAG. `v*-beta.*` only — the nightly workflow owns
# `v*-nightly.*`, and two workflows watching one pattern would both fire and
# race for the same version number.
on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # ON THE MAC MINI, like the nightly — the hosted macOS lane stopped starting
    # jobs (billing) on 2026-09-07, and the Mac has everything this needs:
    # codesign, a release Xcode's notarytool, bun, aws. Same keychain dance as
    # nightly-desktop.yml, which has run here since August.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, telar-nightly]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-desktop.sh resolves --ref against full origin history

      # Same rule, same enforcement as the nightly workflow: removing the `ref`
      # input stops a build being AIMED off main, but a tag can still be PLACED
      # off main, and a tag push is now a trigger. Ancestry rather than
      # equality, so tagging an older main commit stays legal.
      - name: Refuse to build a tag that is not on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Releases come from main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - uses: oven-sh/setup-bun@v2

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$MACOS_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # ON A PERSISTENT MAC, save the search list and search ONLY the CI
          # keychain — the login keychain carries the same Developer ID cert,
          # and two matches make name-based signing ambiguous. The cleanup
          # step restores the exact prior list. Same rule as nightly-desktop.
          security list-keychains -d user > "$RUNNER_TEMP/keychain-search-list.txt"
          security list-keychains -d user -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/apple_api_key.p8"

      # build-desktop.sh --publish-r2 uploads through the aws CLI, which the
      # macOS runner image does not reliably ship. Its preflight fails fast
      # rather than mid-build, but only after a long build has already run.
      - name: Ensure the aws CLI is on PATH
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          aws --version

      - name: Build, sign, notarize, and publish to R2
        env:
          # Restrict codesign to this job's keychain (see the import step).
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          UPDATE_PROXY_URL: ${{ secrets.UPDATE_PROXY_URL }}
          UPDATE_PROXY_KEY: ${{ secrets.UPDATE_PROXY_KEY }}
        run: |
          # A tag names a commit, so a tag-triggered run builds THAT commit
          # rather than the tip main may already have moved to. The ancestry
          # guard above has established it is on main either way.
          REF="origin/main"
          VERSION_ARG=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REF="$GITHUB_SHA"
            # The tag already named the version; the derivation would COUNT this
            # tag and produce the next one, releasing under a name nobody chose.
            VERSION_ARG=(--version "${GITHUB_REF_NAME#v}")
          fi
          bash scripts/build-desktop.sh --ref "$REF" --targets zip,dmg "${VERSION_ARG[@]}" \
            --channel beta --publish-r2

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          OUT="apps/desktop/release/from-origin"
          VERSION="$(cat "$OUT/VERSION")"
          ARTIFACTS=("$OUT"/*.zip "$OUT"/*.dmg)
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "!! no release artifacts found" >&2
            exit 1
          fi
          gh release create "v$VERSION" "${ARTIFACTS[@]}" \
            --repo "${{ github.repository }}" \
            --title "v$VERSION" \
            --prerelease \
            --generate-notes

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/keychain-search-list.txt" ]; then
            python3 - <<'PYTHON'
          import os, pathlib, shlex, subprocess
          saved = pathlib.Path(os.environ["RUNNER_TEMP"]) / "keychain-search-list.txt"
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *shlex.split(saved.read_text())], check=True)
          PYTHON
          fi
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple_api_key.p8" "$RUNNER_TEMP/keychain-search-list.txt" 2>/dev/null || true
