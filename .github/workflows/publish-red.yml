name: Publish red

# THE PUBLISHING PIPELINES HAD NO ALARM, AND IT COST A DAY.
#
# `nightly-ios.yml` failed four consecutive runs from 2026-09-19T03:45Z — last
# green 2026-09-18T21:35Z — and nobody found out. No TestFlight build shipped in
# that window. It was noticed only because someone went looking for something
# else (#757).
#
# `main-red.yml` is the same idea for `Verify`, and deliberately does NOT cover
# these: it filters `branches: [main]`, and these are triggered by TAG pushes,
# whose `head_branch` is the tag rather than a branch. A filter that silently
# matches nothing is exactly the failure this file exists to prevent, so this
# is a separate workflow with no branch filter rather than a wider list on that
# one.
#
# ONE ISSUE PER WORKFLOW, not one for all three. These fail independently and
# for unrelated reasons — the iOS pipeline currently carries two distinct faults
# at once (#757 at export, #758 at archive) — and a shared issue would make
# "is the desktop nightly healthy" unanswerable.

on:
  workflow_run:
    workflows:
      - Nightly channel build
      - Nightly iOS build
      - Release desktop app
    types: [completed]

permissions:
  contents: read
  issues: write

# Never cancel one of these: dropping a run here drops the only notice that a
# release pipeline broke. Keyed per workflow so two failing at once do not
# evict each other.
concurrency:
  group: publish-red-${{ github.event.workflow_run.name }}

jobs:
  report:
    name: Open or close the red-publish issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      REF: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Open or update the issue for this workflow
        if: github.event.workflow_run.conclusion == 'failure'
        run: |
          set -euo pipefail

          gh label create publish-red \
            --repo "$REPO" \
            --color D93F0B \
            --description "a publishing workflow is failing" 2>/dev/null || true

          # The title carries the workflow name, so the lookup finds THIS
          # pipeline's issue rather than whichever one happens to be open.
          title="publishing is red — $WORKFLOW"
          existing="$(gh issue list --repo "$REPO" --label publish-red --state open \
            --search "$title in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"

          body="$(cat <<EOF
          **$WORKFLOW** failed on [\`${SHA:0:8}\`]($RUN_URL) (\`$REF\`).

          Nothing was published by that run. This issue closes itself when the
          same workflow next succeeds.

          If it is red for a known reason, say which issue here rather than
          closing this — a closed alarm with the fault still present is how the
          last one went unnoticed for a day.
          EOF
          )"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on #$existing"
          else
            number="$(gh issue create --repo "$REPO" \
              --title "$title" \
              --label publish-red \
              --body "$body" | sed 's:.*/::')"
            echo "opened #$number"
            gh issue edit "$number" --repo "$REPO" --add-assignee Facundo-Barbera || \
              echo "note: could not assign; the issue is open regardless"
          fi

      - name: Close this workflow's issue
        if: github.event.workflow_run.conclusion == 'success'
        run: |
          set -euo pipefail
          title="publishing is red — $WORKFLOW"
          existing="$(gh issue list --repo "$REPO" --label publish-red --state open \
            --search "$title in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty" 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "$WORKFLOW is green again on [\`${SHA:0:8}\`]($RUN_URL)."
            echo "closed #$existing"
          else
            echo "$WORKFLOW is green and no issue is open; nothing to do."
          fi
