name: Nightly iOS tests (device)

# THE FIRST THING IN THIS REPO THAT RUNS A SWIFT TEST. Before this file there
# was no `xcodebuild test` in .github/workflows at all: verify.yml is titled
# "everything that does not need a Mac" and compiles no Swift, and
# nightly-ios.yml runs nightly.sh, which archives and uploads without ever
# testing. So apps/ios/TelarMobileTests was green only as often as someone
# remembered to run it by hand. See #675.
#
# NIGHTLY, NOT A PR GATE — decided, and the reasoning belongs here rather than
# in a PR nobody will find again. This job needs a phone physically connected
# to the Mac and unlocked since its last boot. A required check with that
# dependency goes red because a cable was unplugged, which teaches everyone to
# merge past a red check; verify.yml already carries the mirror-image warning
# that "a required check that never reports blocks the PR forever". Neither
# failure is about the code under review. A nightly that fails loudly and in
# public is the honest shape for a test whose precondition is hardware.
#
# ON A TIMER, unlike the other two "nightly" workflows here — nightly-desktop
# and nightly-ios publish artifacts, so a tag is the deliberate act and the
# build is the consequence. This one publishes nothing and installs nothing
# anybody receives, so there is no act to deliberate: it either ran today or
# the suite is unverified today. The hour is a working-hours one on purpose.
# The phone has to be on the desk, on a cable, and unlocked; at 03:00 it is
# none of those, and a nightly that fails every night for a reason unrelated
# to the tests is a nightly nobody reads.
#
# NO SIMULATOR, and this file must not become the reason one gets installed.
# apps/ios/README.md:49 records the 2026-09-11 decision: a runtime is 16 GB and
# the phone is the test target. The device destination below is that decision
# carried into CI, not a workaround for it.
# ════════════════════════════════════════════════════════════════════════════
# PARKED 2026-09-20, ONE DAY AFTER IT SHIPPED. See #755; #675 is why it exists.
#
# CI moved to GitHub-hosted runners, and this is the only one of the six
# workflows that could not come. GitHub hosts Macs; it does not host a Mac with
# Facundo's iPhone attached. Everything below still works and is left intact —
# what is removed is the `schedule:` that ran it, nothing else.
#
# WHY, and it is about proportion rather than the tests mattering less: the iOS
# app has two TestFlight users, so keeping a self-hosted runner alive for this
# costs more than the coverage returns. That runner was also a single point of
# failure for all of CI — the night this was written, runs queued 53 minutes
# behind it and main went 27 commits without a green.
#
# THE COST, stated plainly: apps/ios/TelarMobileTests goes back to running only
# when someone runs it by hand, which is the exact state #675 was opened to fix.
# Accepted, not overlooked.
#
# TO BRING IT BACK: restore the `schedule:` block below and register a runner,
# on any machine with the phone attached, carrying the `telar-nightly` label.
# Nothing else here needs to change. The alternative — simulators on hosted
# macOS — is a real decision about what "tested" means for this app, not a
# config change: see the NO SIMULATOR note above and apps/ios/README.md:49.
# Natural moment to revisit: more TestFlight users, or the first iOS regression
# that reaches them.
#
# `workflow_dispatch` is KEPT so the job can still be run by hand against a
# runner that has a phone, without editing this file first.
# ════════════════════════════════════════════════════════════════════════════
on:
  # DISABLED — the timer is removed, not commented out at random. The original:
  #   schedule:
  #     - cron: "23 16 * * *"   # 16:23 UTC = 10:23 America/Mexico_City
  # It was off the hour deliberately: GitHub's scheduler queues the :00 spike,
  # and this job wanted the Mac awake rather than the backlog. Restore it exactly
  # as above if the job comes back.
  workflow_dispatch:

permissions:
  contents: read

# Shares the one self-hosted runner with every other workflow, which takes a
# single job at a time. Not cancel-in-progress: a half-run device test leaves
# the phone mid-install, and there is no queue of these worth racing.
concurrency:
  group: nightly-ios-tests
  cancel-in-progress: false

jobs:
  device-tests:
    name: TelarMobileTests on the connected iPhone
    # PARKED — THIS JOB CANNOT RUN, AND THAT IS THE POINT (#755).
    #
    # `runs-on` below still names `telar-nightly`, a self-hosted runner that is
    # being removed from the maintainer's Mac. Without this guard a
    # `workflow_dispatch` would not fail — it would sit QUEUED FOR EVER against
    # a runner that does not exist, which is the same silent-hang shape
    # verify.yml's header warns about for path filtering. `if: false` turns
    # that into an immediate, legible skip.
    #
    # Restoring the job is two edits, not one: put back the `schedule:` block
    # quoted in the header AND delete this `false &&`. Both, or it stays parked.
    #
    # The real condition is kept to the right of `false &&` rather than
    # deleted, so the restore does not have to reconstruct it: a schedule always
    # carries the default branch's ref, so it admits the cron and a dispatch
    # from main, and nothing aimed off a branch.
    if: false && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, telar-nightly]
    # The runner takes one job at a time, so a hang here holds every release
    # behind it. A cold run (no DerivedData) builds the app, the extension and
    # the test bundle, then installs and runs on the phone.
    timeout-minutes: 30
    env:
      # The Mac's one Xcode. `xcode-select` is not used anywhere on this runner:
      # the service's user has no passwordless sudo, and a bare xcode-select can
      # name the Command Line Tools, which cannot build for a device at all.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # The same phone apps/ios/phone.sh installs to (its default, phone.sh:12).
      # The repo variable is an override for the day the handset is replaced —
      # unset, this is the committed default, so the job needs no repo setup.
      TELAR_IPHONE_UDID: ${{ vars.TELAR_IPHONE_UDID || '00008150-001A7DC2367B401C' }}
      DEVELOPMENT_TEAM: MM74W7WGAM
      RESULT_BUNDLE: ${{ github.workspace }}/apps/ios/DerivedData-ci/TelarMobileTests.xcresult
    steps:
      - uses: actions/checkout@v4

      # THE WHOLE POINT OF THIS JOB IS THAT THIS STEP CANNOT BE SKIPPED.
      # A test run that goes green because it found no device is worse than no
      # test run: it manufactures confidence in a suite that has never been
      # executed by automation. So the phone is proven present BEFORE anything
      # is built, and the job dies here rather than anywhere clever.
      #
      # `devicectl list devices` IS NOT A LIVENESS CHECK, and neither is
      # `device info details` — both serve the Mac's stored pairing record.
      # Measured on this runner 2026-09-19: an iPad last connected eight days
      # earlier still appears in `list devices`, and `info details` exits 0 for
      # it. Grepping either for the UDID would pass with the phone in another
      # room. `info lockState` is the cheapest call that actually round-trips to
      # the hardware: exit 0 for the wired iPhone, exit 1 with CoreDeviceError
      # 4016 for the absent iPad, measured the same day.
      - name: Require a reachable, unlocked iPhone
        run: |
          set -euo pipefail

          if [ -z "${TELAR_IPHONE_UDID}" ]; then
            echo "::error::TELAR_IPHONE_UDID is empty. Set the repository variable TELAR_IPHONE_UDID to the test phone's UDID, or restore the default in this workflow."
            exit 1
          fi

          echo "Probing ${TELAR_IPHONE_UDID}..."
          if ! xcrun devicectl device info lockState \
                 --device "$TELAR_IPHONE_UDID" \
                 --timeout 60 \
                 --json-output "$RUNNER_TEMP/lockstate.json"; then
            echo "::error::No reachable iPhone at ${TELAR_IPHONE_UDID}. The device must be plugged into the runner Mac, trusted, and awake. This job does not fall back to a simulator and does not skip: an unrun suite reports as a failure, by design (#675)."
            exit 1
          fi

          # `unlockedSinceBoot` is the one that decides whether an install can
          # succeed: a phone that rebooted and was never unlocked keeps its
          # data-protection classes sealed, and xcodebuild fails minutes later
          # with an install error that reads like a signing problem. Catch it
          # here, where the message can say what to actually do about it.
          UNLOCKED=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['result'].get('unlockedSinceBoot'))" "$RUNNER_TEMP/lockstate.json")
          if [ "$UNLOCKED" != "True" ]; then
            echo "::error::The iPhone at ${TELAR_IPHONE_UDID} has not been unlocked since it booted, so the test host cannot be installed. Unlock the phone once with its passcode."
            exit 1
          fi
          echo "Phone reachable and unlocked since boot."

      # -only-testing:TelarMobileTests, though the TelarMobile scheme's
      # TestAction currently holds nothing else. It is a fence, not a filter:
      # TelarMobileUITests drives the app against apps/ios/scripts/preview-server.py
      # and would hang here with no server running, so adding that target to the
      # scheme must not silently change what the nightly executes.
      #
      # TELAR_APP_BUNDLE_ID=com.telar.mobile.dev, AND THIS IS NOT COSMETIC.
      # The project default is com.telar.mobile (project.pbxproj:336) — the
      # TestFlight app's identifier. `xcodebuild test` installs its test host on
      # the device, so running the documented command as-written replaces the
      # TestFlight nightly on the phone with a dev-signed build. Overriding to
      # the .dev id is what phone.sh already does (phone.sh:20), and it makes
      # the test host the cable-fed app iOS treats as unrelated. The nightly
      # people actually use stays where it is.
      - name: Run TelarMobileTests on the phone
        run: |
          set -euo pipefail
          rm -rf "$RESULT_BUNDLE"
          xcodebuild \
            -project apps/ios/TelarMobile.xcodeproj -scheme TelarMobile \
            -configuration Debug \
            -destination "platform=iOS,id=$TELAR_IPHONE_UDID" \
            -destination-timeout 120 \
            -derivedDataPath apps/ios/DerivedData-ci \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:TelarMobileTests \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            TELAR_APP_BUNDLE_ID=com.telar.mobile.dev \
            INFOPLIST_KEY_CFBundleDisplayName="Telar Dev" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIconDev \
            test

      # THE SECOND WAY A TEST STEP LIES. `xcodebuild test` can exit 0 having
      # executed nothing — a destination that resolved to something empty, a
      # filter that matched no target, a test plan that skipped every suite.
      # The exit status alone cannot tell "all 300 passed" from "none ran", and
      # this job exists precisely because nobody has been watching these tests.
      # So the count is read back from the result bundle and zero is a failure.
      #
      # always(), so a red suite still gets its failures named in the log
      # instead of leaving a bare xcodebuild exit code above. That also covers
      # the compile-failure case, where no bundle is written at all.
      - name: Require that tests actually ran
        if: always()
        run: |
          set -euo pipefail

          if [ ! -e "$RESULT_BUNDLE" ]; then
            echo "::error::xcodebuild produced no result bundle, so no test was executed — it failed before running any. See the previous step."
            exit 1
          fi

          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact > "$RUNNER_TEMP/summary.json"
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys

          s = json.load(open(sys.argv[1]))
          total = s.get("totalTestCount") or 0
          passed = s.get("passedTests") or 0
          failed = s.get("failedTests") or 0
          skipped = s.get("skippedTests") or 0

          print(f"{total} tests: {passed} passed, {failed} failed, {skipped} skipped "
                f"({s.get('environmentDescription', 'unknown environment')})")

          for f in s.get("testFailures") or []:
              name = f.get("testName") or f.get("targetName") or "unknown test"
              print(f"::error::{name}: {f.get('failureText', '').strip()}")

          if total == 0:
              print("::error::The run reported zero tests. xcodebuild exiting 0 having executed "
                    "nothing is the failure this job was built to catch, not a pass.")
              sys.exit(1)

          # A red suite already failed the step above; this exit keeps the job
          # red if that step is ever made non-fatal.
          sys.exit(1 if failed else 0)
          PY
