name: CI probe

# TEMPORARY MEASUREMENT WORKFLOW — delete before this branch merges.
#
# It exists to answer one question nobody has a number for: what does a real
# `Verify` cost on a GitHub-hosted runner, cold cache included? The 2-second
# probe on run 35487250897 proved the hosted lane starts jobs again; it did not
# run our suite. Every job here is hosted, so none of it touches the Mac's queue.
#
# Four shapes, measured side by side in one run:
#   cold    — hosted, no dependency cache. The honest first-run cost.
#   warm    — hosted, actions/cache on bun's global install cache.
#   matrix  — the six suites as six concurrent hosted jobs.
#   gate    — typecheck + lint only, the cheap-PR-gate shape.

on:
  push:
    branches: ["telar/ci-es-el-cuello-de-botella-optimizar-ver-aa9ff5"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold:
    name: "hosted cold: full verify, no cache"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test

  warm:
    name: "hosted warm: full verify, actions/cache"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test

  matrix:
    name: "hosted matrix: ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [engine-client, env, engine, web, desktop, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - name: Test ${{ matrix.suite }}
        run: bun run test:${{ matrix.suite }}

  gate:
    name: "hosted gate: typecheck + lint only"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
