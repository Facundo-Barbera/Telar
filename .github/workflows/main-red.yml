name: Main red

# THE PREREQUISITE FOR ANY POST-MERGE VERIFICATION TIER.
#
# Today a red `main` is SILENT. Nothing in this repository notifies on failure —
# no `if: failure()`, no issue, no message, in any of the six workflows. That is
# survivable only while every check is pre-merge. The moment anything moves to
# "verified after the fact", a silent red main makes the trade worthless, so this
# lands before the split, not after it.
#
# `on: workflow_run` rather than a step inside Verify, for two reasons:
#   - it reads the WHOLE run's conclusion, not one job's, so it still fires when
#     the job dies in a way a final step would never reach (cancelled, timed
#     out, the runner going away mid-job);
#   - it is branch-scoped here, so it can never fire on a pull request.
#
# NOTE FOR WHOEVER MERGES THIS: `workflow_run` triggers are only honoured from
# the DEFAULT BRANCH. This workflow does nothing at all until it is on `main`,
# and cannot be tested from a branch. That is a GitHub constraint, not an
# oversight — see the PR for how it was exercised instead.

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

# One notifier at a time, and never cancel one: dropping a run here is dropping
# the only signal that main broke. `cancel-in-progress` is deliberately absent.
concurrency:
  group: main-red

jobs:
  report:
    name: Open or close the red-main issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the red-main issue
        if: github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail

          # The label is the lookup key, so it has to exist before it is used.
          # `|| true` because a second concurrent run creating it is fine.
          gh label create main-red \
            --repo "$REPO" \
            --color B60205 \
            --description "main is failing Verify right now" 2>/dev/null || true

          short="${SHA:0:8}"
          # `--jq` does the first-line cut, not `head`: under `pipefail` a `head`
          # that closes the pipe early SIGPIPEs gh and fails the whole step, and
          # a notifier that dies is the one failure this file exists to prevent.
          # Every lookup here is decoration, so none of them may be fatal.
          subject="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]' || echo '(subject unavailable)')"
          author="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.author.name' || echo 'unknown')"

          existing="$(gh issue list --repo "$REPO" --label main-red --state open \
            --json number --jq '.[0].number // empty')"

          body="$(cat <<EOF
          \`main\` is red as of [\`$short\`]($RUN_URL).

          - **commit** — \`$short\` · $subject
          - **author** — $author
          - **run** — [Verify #$RUN_NUMBER]($RUN_URL)

          This issue closes itself automatically when Verify next passes on \`main\`.
          Fix forward or revert; do not leave it open while nightlies run.
          EOF
          )"

          if [ -n "$existing" ]; then
            # Still red, new commit. One issue, a comment per break, so the
            # history of a bad night stays in one place instead of spraying
            # issues that each need closing by hand.
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on #$existing"
          else
            # Assignment is applied AFTER creation, and is allowed to fail: an
            # unassignable user must not cost us the issue itself.
            number="$(gh issue create --repo "$REPO" \
              --title "main is red — $short" \
              --label main-red \
              --body "$body" | sed 's:.*/::')"
            echo "opened #$number"
            gh issue edit "$number" --repo "$REPO" --add-assignee Facundo-Barbera || \
              echo "note: could not assign; the issue is open regardless"
          fi

      - name: Close the red-main issue
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # No label yet means main has never been red. Nothing to close.
          existing="$(gh issue list --repo "$REPO" --label main-red --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "Green again on [\`${SHA:0:8}\`]($RUN_URL)."
            echo "closed #$existing"
          else
            echo "main is green and no red-main issue is open; nothing to do."
          fi
