name: Verify

# Typecheck, lint and test everything that does not need a Mac — plus the one
# block that does, on a hosted Mac rather than a personal one.
#
# Measurements, cost analysis and the decisions behind this shape:
#   docs/operations/ci-throughput-2026-09-20.md
#
# ON GITHUB-HOSTED RUNNERS SINCE 2026-09-20, having lived on the owner's Mac
# mini since 2026-09-11. That move was made because the hosted lane stopped
# starting jobs for billing; the repository is public now, hosted standard
# runners are free for public repositories, and the lane starts jobs again.
#
# WHAT THAT PREVIOUS HEADER GOT WRONG, recorded because both errors cost real
# time and neither was visible from this file:
#
#   - It said "nothing here needs a Mac". Nine tests disagreed. Eight resolved
#     a Claude Code CLI from the host and so passed only on a machine that had
#     one installed — the suite was reporting a fact about the owner's laptop
#     (#752, fixed). The ninth runs `ditto` and is genuinely macOS-only; it is
#     why the `macos` job below exists.
#   - It said "one job, not a matrix, because the runner takes one job at a
#     time and a split would only queue". True of one Mac, false here: the
#     measured ceiling is at least 40 concurrent hosted jobs, so the matrix
#     runs at once rather than queueing.
#
# MEASURED, 2026-09-20: 206s serial on the Mac against ~85s wall hosted — and
# the queue, which was the real cost, is gone: runs waited 39, 49 and 53
# minutes for the single runner on the night this was written.
#
# No paths-ignore: a filtered-out run never reports, and a required check that
# never reports blocks the PR forever. If work needs skipping, skip it with a
# job-level `if:` — a job skipped that way reports success, where a workflow
# skipped by `on: paths` stays pending for ever.
#
# WITH ONE REFINEMENT SINCE THAT WAS WRITTEN, and it is worth knowing before
# reaching for the `if:`. A job skipped that way reports success TO THE PULL
# REQUEST, which is what the paragraph above is about — but it reports
# `skipped` to `verify-passed`, and that job fails on anything but `success`.
# So the `if:` route works for a job outside the aggregate and not for one
# inside it. The path-scoped iOS archive (#767) is inside it, and gets its
# scoping from `runs-on` instead: it always runs, on a free Linux runner that
# compiles nothing when no iOS path changed. See the `ios` job below.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# THE REPO IS PUBLIC, SO A FORK PR RUNS UNTRUSTED CODE. Until 2026-09-20 it
# would have run on the owner's Mac, which is why this guard was written; it is
# kept now that jobs are hosted, because a fork PR still gets repository
# context and a runner. GitHub's approval gate is set to every external
# contributor, and these jobs also refuse at the job level: only pull requests
# from branches IN this repository run. A fork PR gets no check rather than a
# run, and the owner reviews and re-pushes to a `telar/*` branch if it is
# wanted. `github.event.pull_request.head.repo.full_name` is the fork's name on
# a fork PR and this repo's on a branch PR; a push to main has no pull_request
# at all.
#
# Every job below repeats this condition. That is deliberate duplication: a job
# added without it would run fork code, and there is no inherited default to
# rely on.

# CANCELLING IS RIGHT ON A BRANCH AND WRONG ON MAIN — one setting, two refs,
# and it needed splitting rather than choosing between (#687).
#
# On a pull request ref, cancelling is what you want: a new push supersedes the
# commit under test, and a serial runner should not spend minutes proving
# something nobody is waiting on. That half is unchanged.
#
# On `refs/heads/main` the same setting destroys the evidence it was meant to
# produce. Every merge pushes the same ref, joins the same concurrency group,
# and kills the run verifying the PREVIOUS merge. Merge quickly enough and main
# is never proven at all — each merge erases the proof for the one before it.
#
# MEASURED, 2026-09-19: 12 of the last 20 verify runs on main were cancelled —
# 60% — including five consecutively, `fbc250c0` through `4aaa8979`, five
# merges of which not one was verified. The sharpest case is `7b77a276`, the
# merge of #684's SQLite busy-timeout fix: the commit is on main and its own
# verification was cancelled by the next merge, so nothing ever confirmed main
# was green with it. Serialising merges by hand stopped it dead — five clean
# runs in a row — which is what this expression makes automatic rather than
# something a person has to remember.
#
# NOT A RUNNER-LOAD PROBLEM, and the intuitive reading is wrong. Groups never
# span a pull request and main — under the expression below a PR's group is its
# ref and main's is a commit sha, and before it they were two different refs.
# Either way a branch push cannot reach main's run: only a push to
# `refs/heads/main` shares main's group, and only a merge does that. Throttling
# PR pushes buys nothing here; it was verified live that a branch push queues
# behind an in-progress main run rather than killing it.
#
# `cancel-in-progress: false` WAS NOT ENOUGH, and the reason is the whole of
# why this expression looks the way it does. That setting protects a run that
# has STARTED. GitHub separately keeps ONE PENDING RUN PER GROUP, and a newly
# queued run evicts an older QUEUED one no matter what the setting says. On a
# single serial runner "queued" is the common case, not the rare one.
#
# MEASURED after the first fix shipped:
#
#   02cb9c2b  main  00:50:44  in_progress   ← holding the runner
#   e104cf61  main  01:10:35  CANCELLED 01:10:48 — ZERO JOBS, never started
#   fd1662f7  main  01:10:46  pending       ← took the slot
#
# `e104cf61` carried the first fix and was evicted from the pending slot
# thirteen seconds after it was created, with no job ever run. The three main
# runs that DID survive a merge landing on them had all already started, which
# is why the first fix looked complete and was not.
#
# SO EVERY MAIN COMMIT GETS ITS OWN GROUP. A group of one cannot be superseded
# — not in progress, not pending — so every merged commit is verified as
# itself. A green commit means THAT commit, which is the only version of this
# worth having: "which commit broke it" is the question people actually ask.
#
# Pull requests keep the ref as their group and keep cancelling, which is right
# there and unchanged: a new push supersedes the commit under test, and a
# serial runner should not spend minutes proving something nobody waits on.
# A sha can never collide with a ref-shaped group — one is 40 hex, the other
# begins `refs/`.
#
# `A && B || C` IS NOT A TERNARY, and the difference bites here. It yields B
# only when B is TRUTHY; a falsy B falls through to C. So if the middle operand
# could ever be empty, a push would silently land back on the ref group — this
# exact defect, reintroduced invisibly. It cannot: `format('verify-{0}', …)`
# always returns a non-empty string. Verified by evaluating this file's own
# expressions with GitHub's engine (`@actions/expressions`), including that
# substituting an empty middle operand reproduces `verify-refs/heads/main`.
#
# THE COST, stated so nobody trims it back by accident: every main commit now
# queues a run on one serial runner, competing with PR verification — roughly
# 90 minutes at the 22 merges this repo did on 2026-09-19. IF THAT QUEUE
# BECOMES THE BINDING CONSTRAINT, THE ANSWER IS RUNNER CAPACITY OR A CHEAPER
# MAIN JOB — NOT re-introducing a setting that throws the evidence away.
# Reverting this to shorten the queue restores the exact defect #687 records.
# A scheduled verify of main's tip was considered and rejected: it proves the
# tip and leaves every intermediate commit unproven.
concurrency:
  group: ${{ github.event_name == 'push' && format('verify-{0}', github.sha) || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # One anchor for the fork guard and the shared setup would be nice; GitHub
  # has neither, so each job repeats both. Six ubuntu jobs plus two macOS ones,
  # all independent, all starting at once — except `ios`, which waits on
  # `ios-changes` to learn which kind of runner it wants.

  source:
    name: Source invariants
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - run: bun run check:source

      # WORKFLOWS THAT DO NOT LOAD, CAUGHT BEFORE THEY SHIP.
      #
      # A workflow can be valid YAML and still be rejected by GitHub — and that
      # failure is close to invisible. `join(needs.*.result, " ")` cost this
      # repository a diagnosis on 2026-09-20: GitHub's expression language has
      # no double-quoted string, so the file did not load, and what you get is
      # a run listed under the file's PATH rather than its name, with ZERO
      # jobs, no annotation anywhere in the REST API, and a pull request
      # showing NO CHECKS AT ALL rather than a red one. You can read the PR and
      # conclude CI simply has not started yet.
      #
      # `yaml.safe_load` parses that file perfectly. Only a workflow-aware
      # linter catches it, which is why this is a check and not a convention.
      #
      # Pinned by version AND checksum: this downloads a binary and runs it,
      # so "latest" would be an unreviewed executable in the middle of CI.
      - name: Lint the workflow files themselves
        run: |
          set -euo pipefail
          version=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          echo "${sha}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # shellcheck and pyflakes are disabled: this step is about whether
          # GitHub can LOAD the file. Script linting is a separate argument and
          # would fail this job on pre-existing findings across six workflows.
          /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

  typecheck:
    name: Typecheck engine-client, env, engine, and web
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      # SERIAL ON PURPOSE. `bun run typecheck` chains the four packages with
      # `&&`, and making them concurrent was measured SLOWER — 9.9s to 15.0s —
      # because apps/web alone is most of it and four tsc processes contend.
      # The chain was never the constraint. Do not "fix" it.
      - run: bun run typecheck

  lint:
    name: Lint apps/web
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - run: bun run lint

  # THE SUITES, ONE JOB EACH. Serially these are 173s and engine alone is 128s
  # of that, so a matrix is worth far more than making the six concurrent on
  # one machine ever was (measured: 173.1s -> 139.8s, only 19%, because they
  # then contend).
  #
  # ENGINE IS NOT IN THIS LIST — it has its own job below, split three ways.
  # Removing it from the matrix rather than adding a shard axis to it keeps
  # `test:${{ matrix.suite }}` meaning exactly one thing; the five left here
  # finish in well under a minute each.
  #
  # fail-fast: false because one red suite must not hide the state of the
  # others — "what else is broken" is the question you ask next.
  test:
    name: Test ${{ matrix.suite }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [web, desktop, env, engine-client, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # DELIBERATELY NO actions/cache. `bun install` is 6 seconds cold on a
      # hosted runner, and the cache action's own post-step costs up to 6 —
      # measured net negative. The warm cache that made the Mac's install 1s
      # was worth about five seconds, not the large number it was assumed to be.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - run: bun run test:${{ matrix.suite }}

  # THE ENGINE SUITE, SPLIT — #760.
  #
  # MEASURED, not assumed: across 19 successful `Verify` runs, `Test engine` was
  # the longest job on all 12 where iOS did not archive — 109-147s against 58-80s
  # for Electron, 47-52s for lint and 45-58s for typecheck. Install is 7s. So on
  # roughly two runs in three this repository's wall-clock IS this one job, and
  # it was one runner walking every engine test file in a row — 190 of them at
  # the time — while the header above records a measured ceiling of at least 40
  # concurrent hosted jobs.
  #
  # NO TEST IS TOUCHED BY THIS and none is skipped: the split is a partition of
  # the same files, computed from the filesystem by scripts/engine-shard.mjs
  # rather than listed anywhere. `test:desktop:unit` is why that matters — it
  # carried 36 hand-typed filenames until #763 and silently stopped running the
  # ones nobody remembered to add. A file added tomorrow lands in a shard because
  # of where it is.
  #
  # THREE, AND WHY NOT MORE: at three the slowest shard lands near the Electron
  # job, which then becomes the wall — a fourth shard buys runner-minutes and no
  # wall-clock. `shard` and `total` are separate axes so the total lives in one
  # place; `engine-shards-cover-every-test-file` in scripts/source-invariants.mjs
  # reads both back out of this file and fails if the split here and the split
  # the script computes ever disagree.
  #
  # TWO THINGS GO RED RATHER THAN QUIET IF A SHARD LOSES FILES. Each shard
  # compares the file count bun reports against the number of paths it handed
  # over, in band, on every run; and the summed `Ran N tests across M files` must
  # still equal the single-job number, which is the count a dropped file cannot
  # produce.
  test-engine:
    name: Test engine ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      - run: bun scripts/engine-shard.mjs ${{ matrix.shard }} ${{ matrix.total }}

  # THE ONE THING HERE THAT REALLY NEEDS macOS — on a hosted Mac, not a person's.
  #
  # TWO BLOCKS ARE SKIPPED OFF DARWIN AND SO RUN NOWHERE ELSE. The nightly and
  # release workflows build and sign but run no tests, so this job is the only
  # thing in the repository that executes either:
  #
  #   - `dev-update.test.js` > "the swap helper, run for real against fake
  #     bundles" — runs a generated bash script that calls `ditto`.
  #   - `push-relay.test.js` > "writing the Keychain item" — `provisionPushRelay`
  #     refuses off darwin before it looks at anything, so every test in the
  #     block would be asking about a path the platform never reaches (#763).
  #
  # Drop this job and both stop executing rather than start failing, which is
  # the quiet kind of coverage loss.
  macos:
    name: Test desktop on macOS (the ditto swap helper)
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      # AND PROVE THEY ACTUALLY RAN. A `skipIf` that starts matching everywhere
      # would leave this job green while testing nothing, which is exactly the
      # failure this job exists to prevent.
      #
      # THE PREVIOUS VERSION OF THIS GUARD DID NOT WORK, and it is worth saying
      # exactly how, because it is the same defect #763 found inside
      # `push-relay.test.js` — an assertion satisfied by something other than the
      # thing it was guarding. It grepped the console log for the describe name:
      #
      #     grep -q "the swap helper, run for real against fake bundles"
      #
      # A SKIPPED BLOCK PRINTS ITS OWN NAME. bun writes one line per test, and a
      # skipped one reads `(skip) the swap helper, run for real against fake
      # bundles > …`. So the string the guard looked for is present precisely
      # when the thing it was guarding against has happened. Verified against a
      # real CI log — the ubuntu leg of run 35492116321, where all four of those
      # lines are `(skip)` — and that grep matches it.
      #
      # SO KEY ON THE JUNIT REPORT, NOT ON CONSOLE TEXT. `--reporter=junit`
      # emits, per describe block, `tests`, `assertions` and `skipped` counts,
      # which distinguish the two states rather than sharing a substring:
      #
      #   ran:     tests="6" assertions="17" failures="0" skipped="0"
      #   skipped: tests="6" assertions="0"  failures="0" skipped="6"
      #
      # `skipped="0"` cannot be produced by a skipped block, and `assertions`
      # above zero cannot be produced by one either — a block that runs but
      # asserts nothing fails this too. Neither is a count that drifts as tests
      # are added, so nothing here needs maintaining when the blocks grow.
      #
      # The flags go through `bun run … --` rather than being spelled out, so
      # the suite is still defined in exactly one place (`test:desktop:unit`'s
      # glob) and this step cannot fall out of step with it.
      - name: Test desktop, and prove the macOS-only blocks ran
        run: |
          set -euo pipefail
          report=/tmp/desktop-junit.xml
          bun run test:desktop -- --reporter=junit --reporter-outfile="$report"
          prove() {
            block="$1"
            what="$2"
            line=$(grep -F "<testsuite name=\"$block\"" "$report" | head -1 || true)
            if [ -z "$line" ]; then
              echo "::error::no block named '$block' is in the test report — it was renamed or removed, and $what is now asserted by nothing"
              exit 1
            fi
            case "$line" in
              *'skipped="0"'*) ;;
              *)
                echo "::error::the macOS-only block '$block' was SKIPPED on macOS — its skipIf is matching everywhere, so this job is proving nothing about $what"
                exit 1
                ;;
            esac
            case "$line" in
              *'assertions="0"'*)
                echo "::error::the block '$block' ran without making one assertion, so it proves nothing about $what"
                exit 1
                ;;
            esac
            echo "ran on macOS — $block"
          }
          prove "the swap helper, run for real against fake bundles" "the ditto swap helper"
          prove "writing the Keychain item" "the push relay's Keychain write"
          # #808's CONTROL, and it is macOS-only for the same reason the bug was.
          # Only a 3.2-era bash aborts on an empty array under `set -u`, and
          # /bin/bash here is Apple's 3.2.57 — on the ubuntu leg it is 5.x, the
          # failure cannot be reproduced, and the block skips itself. So this is
          # the one runner where "the guards are load-bearing" is asserted by
          # anything, and where a skip would leave the positive block passing
          # against scripts that had lost every guard.
          prove "the guards are load-bearing: removing one reproduces #808" "the bash 3.2 empty-array guards in scripts/*.sh and in the signing steps of .github/workflows/*.yml (#829)"

  # THE ELECTRON SUITE, WHICH NOTHING RAN UNTIL NOW (#622).
  #
  # Fourteen `*.electron-test.js` files drive a REAL Electron against real pages,
  # the real OS clipboard, real popups and a real pseudo-terminal. They are the
  # only proof of several
  # browser behaviours — #618 and #621 both landed verified by nothing else —
  # and because no workflow invoked them and `test:desktop:unit` does not match
  # their name, they could rot silently. One had: `browser-persistence` had been
  # asserting a partition name the registry stopped minting in `3f750551`, and
  # sat green for days because green is what a test nobody runs looks like.
  #
  # macOS, NOT ubuntu + xvfb, and this was weighed rather than assumed:
  #
  #   - `clipboard-write` asserts Chromium's FOCUS GATE — that an unfocused
  #     document is refused before our permission handler is consulted. That is
  #     a real window-server question. Under xvfb with no window manager there
  #     is nothing to grant focus, so the test would fail for the environment
  #     rather than for the code — the precise failure mode this job exists to
  #     avoid creating.
  #   - `popup-geometry` clamps a popup to a display's work area, and
  #     `browser-persistence` reads pixels back out of the compositor, which
  #     needs frames a never-composited X server does not produce.
  #   - The product ships macOS-only (`build.mac` is the only target), so a
  #     macOS runner is the platform these behaviours are claimed about.
  #
  # The cost is macOS runner minutes, already accepted by the `macos` job above.
  # If that ever becomes the binding constraint, the honest move is to drop test
  # files from the list below with a reason, NOT to move the job to a display
  # that cannot answer what these tests ask.
  #
  # ONE JOB, NOT A MATRIX. Unlike the `test` matrix, each leg here would re-pay
  # a ~100 MB Electron download for one or two seconds of test; the whole list
  # is about 35 seconds serially.
  electron:
    name: Test the Electron suite (real Electron, real pages)
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # THE ONE INSTALL IN THIS FILE THAT DOES NOT SET
      # ELECTRON_SKIP_BINARY_DOWNLOAD, and that is the whole point of this job:
      # every other job here wants the package and not the 100 MB executable.
      # This one runs the executable. Setting it would leave `electron` a stub
      # and every step below would fail on a missing binary.
      - name: Install dependencies, Electron binary included
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
      # AND PROVE EACH ONE ACTUALLY RAN. Two independent gates per test, because
      # they catch different things: the exit code (every file ends `app.exit(0)`
      # on success and `app.exit(1)` on a thrown assertion), AND the success
      # marker the file prints last. The marker is what catches an Electron that
      # never got a window and a harness that exits clean without asserting —
      # a tier that cannot fail is the same bug as a tier that never runs.
      #
      # THE LOOP DOES NOT STOP AT THE FIRST FAILURE. One red test must not hide
      # the state of the other nine; "what else is broken" is the question you
      # ask next. Same reason `fail-fast: false` is on the matrix above.
      - name: Run the Electron tests, and prove each one reached its end
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          failed=0
          run_case() {
            script="$1"
            marker="$2"
            log="/tmp/electron-${script}.log"
            echo "::group::test:desktop:${script}"
            if ! bun run "test:desktop:${script}" > "$log" 2>&1; then
              echo "::error::test:desktop:${script} exited non-zero"
              failed=1
            elif ! grep -q "$marker" "$log"; then
              echo "::error::test:desktop:${script} exited 0 but never printed '${marker}' — it did not run to the end, so this job proved nothing about it"
              failed=1
            fi
            cat "$log"
            echo "::endgroup::"
          }

          run_case browser         BROWSER_REGRESSION_OK
          run_case popup           BROWSER_POPUP_OK
          run_case fit-zoom        BROWSER_FIT_ZOOM_OK
          run_case canvas-control  BROWSER_CANVAS_CONTROL_OK
          run_case persistence     BROWSER_PERSISTENCE_OK
          run_case profile-cookies PROFILE_COOKIES_OK
          run_case host-header     HOST_HEADER_OK
          run_case popup-geometry  POPUP_GEOMETRY_OK
          run_case clipboard       "CLIPBOARD OK"
          # #488: the per-process-type surface. Here rather than only in the
          # unit suite because everything load-bearing about it is a question
          # about a REAL Electron — whether `cumulativeCPUUsage` is reported at
          # all (the whole design rests on it), whether the rate maths agrees
          # with real cumulative readings, and whether `getAppMetrics()` pids
          # and `webContents.getOSProcessId()` line up, which is the join the
          # #487 signal is made of.
          # The marker is a COUNT and a pair of OPPOSITE answers, like `pty`
          # below and for the same reason: #787 added a section to this file,
          # and a guard that keeps matching the same bare name through that
          # proves nothing about what was added. `orphan=named page=not-named`
          # are the two answers the SAME real metrics array produced with the
          # page join off and on, so a run that dropped either arm matches
          # nothing. The number is meant to be edited when a section is added.
          run_case metrics         "PROCESS_METRICS_OK 6/6 orphan=named page=not-named"
          # THE MARKER IS A COUNT AND A PAIR OF OPPOSITE ANSWERS, not a name.
          #
          # A test-name grep is the dangerous idiom here — a SKIPPED test prints
          # its own name, so the string a guard requires is present exactly when
          # the thing it guards against has happened. This one cannot be
          # satisfied that way: `10/10` is emitted only after all ten cases have
          # passed, and `pty=tty pipe=not-a-tty` carries the two OPPOSITE
          # answers the same run got from a pseudo-terminal and from a pipe. A
          # run that short-circuits, throws, or drops the control arm prints
          # nothing that matches.
          #
          # THE NUMBER IS MEANT TO BE EDITED. Adding a case changes it here too,
          # deliberately, so a suite that quietly stopped running half of itself
          # cannot keep reporting the same string.
          run_case pty             "PTY_HOST_OK 11/11 pty=tty pipe=not-a-tty"

          # THE THREE THAT ARE NOT HERE, AND WHY — all one reason: they need
          # 1Password's official extension package, which is proprietary, is not
          # in this repository, and cannot be committed to it.
          #
          #   extension-boot, webauthn  — REFUSE to start without TELAR_1P_CRX
          #     pointing at a cached copy. Not broken; unrunnable here.
          #   extension                 — falls back to DOWNLOADING the CRX from
          #     clients2.google.com. It passes today, and that is exactly why it
          #     is excluded: a per-PR gate that fetches a third-party binary from
          #     a CDN goes red for rate limits and version bumps that have
          #     nothing to do with this code, and a gate people learn to ignore
          #     is worth less than no gate.
          #
          # All three still run locally via their `test:desktop:*` scripts. If a
          # cached CRX is ever available to CI as a secret, they belong here.
          [ "$failed" -eq 0 ] || exit 1
          echo "every Electron test ran to its end and passed"

  # DOES THIS CHANGE TOUCH ANYTHING THE iOS ARCHIVE COMPILES? Decided once, on
  # a Linux runner, in seconds — so the Mac below is only ever booted when
  # there is something for it to compile. #767.
  #
  # WHY A JOB AND NOT `on: paths`. The header of this file already says it: a
  # workflow filtered out by `on: paths` never reports, and a required check
  # that never reports blocks the pull request for ever. The filter has to live
  # at the job level, which means something has to compute it, which is this.
  #
  # WHY IT DIFFS RATHER THAN ASKS THE API. `git diff` needs only the
  # `contents: read` this workflow already has, and the answer is derived from
  # the same objects the archive would compile. Adding `pull-requests: read`
  # for `gh api .../files` would buy a marginally shorter checkout.
  #
  # IT FAILS TOWARDS RUNNING THE ARCHIVE. Every path where the diff cannot be
  # computed — a base commit that is not in the fetched history, a force-push
  # that orphaned `github.event.before` — reports `true`. The wrong answer in
  # that direction costs a macOS runner; the wrong answer in the other
  # direction is the gap #767 was filed about.
  ios-changes:
    name: Does anything here reach the iOS build?
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      # fetch-depth: 0 because the diff below reaches back to the merge base,
      # which a depth-1 checkout does not have. The repository is ~37 MB.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE MATCHER, EXERCISED ON KNOWN ANSWERS BEFORE IT IS TRUSTED (#721).
      # A path filter is a regex, regexes are wrong silently, and the failure
      # mode here is the one that matters: a filter that matches nothing leaves
      # every iOS change unarchived while this job stays green. So the same
      # expression the real diff goes through is first run over a table of
      # paths whose answers are known — including the two anchors, which are
      # the parts that rot first.
      - name: The path filter, against paths whose answers are known
        run: |
          set -euo pipefail
          # ONE DEFINITION, USED TWICE. If this and the matcher below were two
          # copies, the self-test would be testing the copy.
          source .github/workflows/ios-paths.sh

          failed=0
          check() { # path expected
            got=no
            printf '%s\n' "$1" | ios_paths | /usr/bin/grep -q . && got=yes
            if [ "$got" != "$2" ]; then
              echo "::error::the iOS path filter says '$1' is ${got}, expected ${2}"
              failed=1
            fi
          }

          check 'apps/ios/TelarMobile/Views/SessionView.swift'   yes
          check 'apps/ios/TelarMobile.xcodeproj/project.pbxproj' yes
          check 'apps/ios/nightly.sh'                            yes
          check 'apps/ios/Config/ActivityInfo.plist'             yes
          # This file gates the archive, so a change to it must archive — which
          # is also how this job's own pull request proves the gate fires.
          check '.github/workflows/verify.yml'                   yes
          check '.github/workflows/ios-paths.sh'                 yes
          # The nightly's workflow does not change what compiles; it changes
          # what publishes. nightly.sh above does, and is in.
          check '.github/workflows/nightly-ios.yml'              no
          check 'apps/web/src/App.tsx'                           no
          check 'docs/operations/dispatch-board.md'              no
          # THE THREE CASES THAT PIN THE PATTERN, and each fails under exactly
          # one mutation of it — checked by running the table against those
          # mutations rather than by reading the regex:
          #   drop `^`                → the first matches
          #   drop the trailing `/`   → the second matches
          #   drop `$`                → the third matches
          # An earlier draft used `apps/iosextra/…` for the first of these and
          # it proved nothing: that path fails on the `/` whether or not `^` is
          # there, so the anchor it was named for was untested.
          check 'vendor/apps/ios/Thing.swift'                    no
          check 'apps/iosextra/Thing.swift'                      no
          check '.github/workflows/verify.yml.bak'               no
          # A .swift outside apps/ios is not in the Xcode project.
          check 'packages/whatever/Helper.swift'                 no

          [ "$failed" -eq 0 ] || exit 1
          echo "the iOS path filter answered all 13 known cases correctly"

      - name: Diff this change against its base
        id: detect
        env:
          # Empty on a push; both present on a pull request.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # `set +e`, AND IT HAS TO BE `+e` RATHER THAN AN ABSENT `-e`.
          # GitHub runs a `run:` block as `bash -e {0}`, so errexit is ALREADY
          # ON before the first line of this script; omitting `set -e` does not
          # turn it off and `set -uo pipefail` does not either. Several
          # commands below are meant to come back non-zero — `grep` exits 1 on
          # no match, and no match is the ORDINARY answer here — so leaving it
          # on kills this step on exactly the pull requests it is meant to say
          # "no" on.
          #
          # This is #768's trap in a second costume, and it was reproduced on
          # the way to writing this: the first negative-case probe run
          # (35505785312) died at `matched=$(… | ios_paths)` with no output at
          # all, which reads far more like "the runner broke" than like "there
          # were no matches". The positive case passes either way, which is why
          # only the negative probe found it.
          set +e
          set -uo pipefail
          source .github/workflows/ios-paths.sh

          run_anyway() { # why
            echo "::warning::$1 — archiving rather than guessing"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Three dots: what this branch changed since it left the base, not
            # what has happened on the base since. A `pull_request` checkout
            # has both parents of the merge commit, so both SHAs are here.
            changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>&1) \
              || run_anyway "cannot diff ${BASE_SHA}...${HEAD_SHA}: ${changed}"
          else
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
              || run_anyway "push event's before-commit ${BEFORE_SHA} is not in this history"
            changed=$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" 2>&1) \
              || run_anyway "cannot diff ${BEFORE_SHA}..${GITHUB_SHA}: ${changed}"
          fi

          total=$(printf '%s\n' "$changed" | /usr/bin/grep -c .)
          matched=$(printf '%s\n' "$changed" | ios_paths)
          hits=$(printf '%s\n' "$matched" | /usr/bin/grep -c .)

          # A COUNT, NOT A COLOUR. "$hits of $total" is a pair of numbers a
          # reader can check against the PR's own file list; "iOS: true" is a
          # claim you would have to take on trust.
          echo "$hits of $total changed path(s) reach the iOS build"
          [ "$hits" -gt 0 ] && printf '%s\n' "$matched" | head -40

          if [ "$hits" -gt 0 ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  # THE ARCHIVE THAT WAS MISSING — an iOS build break, caught on the pull
  # request that causes it rather than on the night it takes TestFlight dark.
  # #767, and #758 is the class of thing it is for: a Swift type-check
  # regression is CUMULATIVE, so no single PR looks like the cause and a
  # per-PR signal is worth more here than it would be in most places.
  #
  # THIS JOB ALWAYS RUNS, AND `runs-on` IS WHAT MAKES THAT AFFORDABLE. When
  # nothing iOS changed it takes a free Linux runner and compiles nothing, in
  # about ten seconds; when something did, it takes a Mac and archives. The
  # alternative — skipping the job outright — would have meant teaching
  # `verify-passed` below to accept `skipped` for one named job, which is the
  # one rule in this file it cannot afford to relax. A job that always reports
  # `success` leaves that rule untouched, and the cost of the difference is a
  # Linux runner boot on the ~95% of pull requests that touch no iOS file.
  #
  # NO SECRETS, and the archive is what makes that possible: signing lives in
  # the EXPORT (nightly.sh re-signs to Apple Distribution on the way to an
  # IPA), so `CODE_SIGNING_ALLOWED=NO` archives with no certificate, no
  # profile and no App Store Connect key. Probe run 35490217749 established
  # this. It also means a red here is a COMPILE failure and never an expired
  # certificate, which is the difference between a gate people read and a gate
  # people learn to re-run.
  #
  # WHY NOT `nightly.sh --no-upload`, which would archive the same app: that
  # script is the PUBLISHING path — unique build numbers, export options,
  # altool — and coupling the pull-request gate to it means a change to how
  # Telar publishes can redden every iOS pull request. What is copied from it
  # is the set of settings that decide what COMPILES, listed below; if those
  # drift apart this gate stops guarding the nightly, which is the one way
  # this can rot.
  #
  # IT ALSO RUNS THE SWIFT SUITE NOW (#755). The name still says "Archive"
  # because `verify-passed` is the one required check and renaming jobs here is
  # free only as long as nobody is pinning them — but the steps below archive
  # Release, report the type-check floor, and then run TelarMobileTests on a
  # simulator, in that order. Each has its own step name and its own assertion.
  ios:
    name: Archive iOS (only when something iOS changed)
    needs: [ios-changes]
    runs-on: ${{ needs.ios-changes.outputs.ios == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # 30 → 45 with the simulator leg (#755). The job now does a Release archive
    # AND a Debug test build plus a simulator boot, so the ceiling has to cover
    # both; the archive alone measured 3m48s–4m08s. A timeout is not a budget —
    # if this job ever approaches 45 minutes something is wrong rather than
    # slow, and the `IOS_TESTS_SECONDS` line below is what to read first.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        if: needs.ios-changes.outputs.ios == 'true'

      - name: Confirm the Xcode
        if: needs.ios-changes.outputs.ios == 'true'
        run: xcodebuild -version

      # THE FIVE SETTINGS COPIED FROM nightly.sh, because they are the ones
      # that decide what the compiler sees: project, scheme, `Release`,
      # `generic/platform=iOS`, `DEVELOPMENT_TEAM`. Everything else there is
      # about publishing and is deliberately absent — no `-allowProvisioningUpdates`
      # (it exists for cloud signing, which needs the keys this job does not
      # have), no build number, no display name.
      #
      # THE MEASUREMENT, which is the half of #767 that turns this from binary
      # into a number: #758 was a THRESHOLD, not a break — an expression that
      # fit on the maintainer's Mac and not on a hosted runner — so an archive
      # that merely passes today can be one modifier from failing. 500 ms is
      # the bar #768 settled on; it left the worst layer at 79 ms, six times
      # under it. `$(inherited)` keeps whatever the project sets: a bare
      # assignment on the command line is the highest level there is and would
      # otherwise erase the target's own flags.
      #
      # THE LOG GOES TO A FILE, not the console, and not through `-quiet`.
      # `-quiet` would drop the swiftc command lines, and those are the only
      # evidence that the flags above reached the compiler at all — which the
      # step after next asserts rather than assumes.
      - name: Archive TelarMobile, unsigned
        if: needs.ios-changes.outputs.ios == 'true'
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/TelarMobile.xcodeproj -scheme TelarMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/TelarMobile.xcarchive" \
            DEVELOPMENT_TEAM=MM74W7WGAM \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=500 -Xfrontend -warn-long-function-bodies=500' \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || {
              status=$?
              echo "::group::the archive log, last 300 lines"
              tail -300 "$RUNNER_TEMP/archive.log"
              echo "::endgroup::"
              echo "::error::xcodebuild archive failed (exit $status) — the iOS app does not build from this branch"
              exit "$status"
            }
          echo "xcodebuild exited 0; $(wc -l < "$RUNNER_TEMP/archive.log") lines of log"

      # EXIT 0 IS NOT AN ARCHIVE. This repository has been bitten by
      # instruments that cannot fail — its own macOS job once "proved the
      # macOS block ran" by grepping a describe name, and a SKIPPED test
      # prints its own name, so the string was present exactly when the thing
      # it guarded against had happened.
      #
      # So this asserts on something the failure state cannot produce: Mach-O
      # binaries inside the `.xcarchive`. An archive that did not happen leaves
      # no directory; one that half-happened leaves a directory with nothing
      # executable in it; a job that short-circuited prints no count at all.
      # The count is 2 because the app embeds the TelarActivity extension —
      # if the extension ever stops building, this reads 1/2 and goes red
      # rather than quietly archiving half the product.
      - name: Assert the archive holds a built app and its extension
        if: needs.ios-changes.outputs.ios == 'true'
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/TelarMobile.xcarchive"
          APP="$ARCHIVE/Products/Applications/TelarMobile.app"
          if [ ! -d "$ARCHIVE" ]; then
            echo "::error::xcodebuild exited 0 but produced no .xcarchive at $ARCHIVE"
            exit 1
          fi

          found=0
          report=""
          for binary in "$APP/TelarMobile" "$(find "$APP" -maxdepth 2 -name '*.appex' -print -quit 2>/dev/null)/TelarActivity"; do
            name=$(basename "$binary")
            if [ ! -f "$binary" ]; then
              echo "::error::$name is missing from the archive"
              continue
            fi
            # `file` says Mach-O only of something that actually linked.
            if ! /usr/bin/file -b "$binary" | /usr/bin/grep -q 'Mach-O'; then
              echo "::error::$name exists in the archive but is not a Mach-O executable"
              continue
            fi
            found=$((found + 1))
            report="$report $name=$(/usr/bin/stat -f%z "$binary")B/$(/usr/bin/lipo -archs "$binary")"
          done

          if [ "$found" -ne 2 ]; then
            echo "::error::the archive carries $found of the 2 expected Mach-O products"
            find "$ARCHIVE/Products" -maxdepth 4 2>/dev/null | head -30
            exit 1
          fi
          echo "IOS_ARCHIVE_OK 2/2$report"

      # A NUMBER, NOT A VERDICT — this step does not fail on a slow expression.
      # Whether a 900 ms view should stop a pull request is a policy nobody has
      # chosen yet (#764 tracks the views nearest the bar); reporting it is
      # what #767 asked for. The ARCHIVE above is the thing that fails.
      #
      # WHAT IT DOES FAIL ON is its own wiring. If no swiftc command line
      # carries the floor, every number below is an absence of evidence rather
      # than evidence of absence, and "no warnings" would read as good news
      # from an instrument that was never switched on.
      #
      # TWO TRAPS FROM #768, BOTH REPRODUCED THERE AND BOTH AVOIDED HERE: this
      # runs with errexit explicitly OFF, because `grep` exiting 1 on no match
      # is the SUCCESS case and killed that probe on the run where the fix
      # worked; and nothing here filters by an unanchored filename, which
      # silently credited `SessionView.swift` with `NewSessionView.swift`'s
      # 171 ms.
      - name: How much type-checker budget is left?
        if: needs.ios-changes.outputs.ios == 'true'
        run: |
          # `+e` rather than a missing `-e`: GitHub hands this block to
          # `bash -e`, so errexit is on unless something turns it off. Every
          # `|| true` below would still be needed without this, and this would
          # still be needed with them — belt and braces, on the step whose
          # whole job is to report a zero as a zero.
          set +e
          set -uo pipefail
          LOG="$RUNNER_TEMP/archive.log"
          FLOOR=500

          carriers=$(/usr/bin/grep -ac -- "-warn-long-expression-type-checking=$FLOOR" "$LOG" || true)
          if [ "${carriers:-0}" -eq 0 ]; then
            echo "::error::no swiftc command line in the archive log carries -warn-long-expression-type-checking=$FLOOR. The measurement is not wired up, so it has nothing to report — this is not a clean bill of health."
            exit 1
          fi

          over=$(/usr/bin/grep -aE 'took [0-9]+ms to type-check' "$LOG" | sed 's|^.*/||' | sort -u || true)
          count=$(printf '%s\n' "$over" | /usr/bin/grep -c . || true)

          echo "TYPE_CHECK_FLOOR ${FLOOR}ms carriers=$carriers over=$count"
          {
            echo "### iOS type-check budget"
            echo
            echo "\`$carriers\` swiftc invocation(s) carried the ${FLOOR}ms floor; **$count** expression(s) or function body(ies) exceeded it."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${count:-0}" -gt 0 ]; then
            # Worst first, and deduplicated by line rather than averaged:
            # #768 saw the same declaration reported twice per archive with
            # different numbers. A Release archive compiles each module in one
            # whole-module swiftc invocation — `carriers` above is 2, one per
            # module — and the first run of this step reported each
            # declaration once. If duplicates do appear, both are shown; the
            # worst is the figure that matters.
            echo "::warning::$count expression(s) or function body(ies) are over the ${FLOOR}ms floor"
            printf '%s\n' "$over" \
              | sed -E 's/.*took ([0-9]+)ms.*/\1 &/' | sort -rn | cut -d' ' -f2- | head -20 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # THE 661 TESTS CI HAS NEVER RUN (#755, and #675 is why they exist).
      # `apps/ios/TelarMobileTests` has been green only as often as someone
      # remembered to run it by hand: `nightly-ios-tests.yml` carried the only
      # `xcodebuild test` in this repository and its scheduler window was 8½
      # hours wide around a cron that never came due, so GitHub's run count for
      # it was 0 for its whole life. Deleted in this change; its reasoning is
      # in apps/ios/README.md, and this is where the tests run now.
      #
      # STEPS ON THE EXISTING JOB, NOT A SECOND JOB. The checkout and the three
      # remote SPM resolutions are already paid here, and `ios` already picks a
      # Mac exactly when an iOS path changed — so the same
      # `needs.ios-changes.outputs.ios == 'true'` guard inherits all of #818's
      # wiring and adds nothing to the ~95% of pull requests that touch no iOS
      # file. `verify-passed`'s "only success passes" rule is untouched. The
      # cost is failure attribution: an archive break and a test failure land in
      # one job, which the step names disambiguate.
      #
      # AFTER THE TYPE-CHECK REPORT, DELIBERATELY. That step is the instrument
      # #764 reads its floor-10 map from; running the tests first would mean a
      # red suite hides the measurement that the next refactor depends on.
      #
      # A SIMULATOR, NOT THE PHONE, AND THE SUITE DOES NOT CARE. All 64 files
      # are `import Testing`; the census is 59 Foundation, 5 SwiftUI, 1 UIKit,
      # 1 UniformTypeIdentifiers, and zero occurrences of `UIScreen`,
      # `UIDevice`, `UIApplication` or `Bundle.main`. Nothing in the suite
      # asserts anything only hardware can produce — the device destination was
      # never about what the tests check, it was that the phone was the only
      # iOS runtime on the maintainer's Mac. `macos-26-arm64` ships iOS 26.2 /
      # 26.4 / 26.5 runtimes preinstalled against a deployment target of 18.0,
      # so nothing is downloaded and nothing persists: the runner is destroyed
      # after the job. apps/ios/README.md's "no simulators" rule is about that
      # one Mac's disk and it stays exactly as it is.
      #
      # `name=iPhone 17` WITHOUT AN OS PIN — the device is present in all three
      # preinstalled runtimes, so an image update that retires one of them does
      # not invalidate this line. Debug because `test` needs a test bundle; the
      # Release archive above is the configuration the type-check numbers come
      # from and the two must not share a derived-data path.
      #
      # `-only-testing:TelarMobileTests` IS A FENCE, NOT A FILTER. The scheme's
      # TestAction holds nothing else today, but `TelarMobileUITests` drives the
      # app against apps/ios/scripts/preview-server.py and would hang here with
      # no server running. Adding that target to the scheme must not silently
      # change what this executes.
      #
      # NO SIGNING, same posture as the archive: simulator builds are ad-hoc
      # signed, so this needs no certificate, no profile and no App Store
      # Connect key. A red here is a compile or a test, never an expired cert.
      - name: Run TelarMobileTests on a simulator
        if: needs.ios-changes.outputs.ios == 'true'
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          set -euo pipefail
          RESULT_BUNDLE="$RUNNER_TEMP/TelarMobileTests.xcresult"
          rm -rf "$RESULT_BUNDLE"
          started=$(date +%s)
          xcodebuild \
            -project apps/ios/TelarMobile.xcodeproj -scheme TelarMobile \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:TelarMobileTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test > "$RUNNER_TEMP/test.log" 2>&1 || {
              status=$?
              echo "::group::the test log, last 400 lines"
              tail -400 "$RUNNER_TEMP/test.log"
              echo "::endgroup::"
              echo "::error::xcodebuild test failed (exit $status) — see the step after this one for which tests, if any, ran"
              echo "IOS_TESTS_SECONDS $(( $(date +%s) - started ))"
              exit "$status"
            }
          echo "IOS_TESTS_SECONDS $(( $(date +%s) - started ))"
          echo "xcodebuild exited 0; $(wc -l < "$RUNNER_TEMP/test.log") lines of log"

      # EXIT 0 IS NOT A TEST RUN, and this repository already owns both halves
      # of that lesson: its macOS job once "proved the macOS block ran" by
      # grepping a describe name, and a SKIPPED test prints its own name — the
      # string was present exactly when the thing it guarded against had
      # happened. `xcodebuild test` can exit 0 having executed nothing: a
      # destination that resolved to something empty, a filter matching no
      # target, a plan that skipped every suite.
      #
      # A FLOOR ON `passedTests`, NOT `totalTestCount > 0`. The step this is
      # lifted from failed on `total == 0` and on `failed`, and so exited 0 when
      # every test was SKIPPED and none failed — the same wound in a new
      # costume. 661 is the count of `@Test` cases at the time of writing (662
      # in the tree today, none parameterised, so one case per declaration), and
      # a floor rather than an equality so that adding tests never reddens this
      # and removing a suite always does. It also makes it irrelevant whether
      # `totalTestCount` counts skipped cases, which is the more robust
      # instrument either way — and is why that question was deliberately not
      # looked up and relied on.
      #
      # RAISE THE FLOOR WHEN TESTS ARE ADDED, but only deliberately: it is the
      # one number here that a human has to maintain, and lowering it to make a
      # red go away is the failure this step exists to prevent.
      #
      # `environmentDescription` IS PRINTED because it names the runtime the
      # run actually landed on, which is the cheap way to notice an image
      # change before it becomes a mystery.
      #
      # always(), so a red suite still gets its failures named here rather than
      # leaving a bare xcodebuild exit code above. That also covers the
      # compile-failure case, where no bundle is written at all.
      - name: Require that the tests actually ran
        if: always() && needs.ios-changes.outputs.ios == 'true'
        run: |
          set -euo pipefail
          RESULT_BUNDLE="$RUNNER_TEMP/TelarMobileTests.xcresult"
          FLOOR=661

          if [ ! -e "$RESULT_BUNDLE" ]; then
            echo "::error::xcodebuild produced no result bundle at $RESULT_BUNDLE, so no test was executed. If the archive or the test build failed above, that is the cause; if neither did, the destination resolved to nothing."
            exit 1
          fi

          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact > "$RUNNER_TEMP/summary.json"
          FLOOR="$FLOOR" python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, os, sys

          s = json.load(open(sys.argv[1]))
          floor = int(os.environ["FLOOR"])
          total = s.get("totalTestCount") or 0
          passed = s.get("passedTests") or 0
          failed = s.get("failedTests") or 0
          skipped = s.get("skippedTests") or 0
          where = s.get("environmentDescription", "unknown environment")

          print(f"IOS_TESTS {passed} passed, {failed} failed, {skipped} skipped "
                f"of {total} ({where})")

          for f in s.get("testFailures") or []:
              name = f.get("testName") or f.get("targetName") or "unknown test"
              print(f"::error::{name}: {f.get('failureText', '').strip()}")

          bad = False
          if passed < floor:
              print(f"::error::{passed} tests passed, under the floor of {floor}. Either a suite "
                    f"was skipped or disabled, or the destination ran less than the whole target. "
                    f"A run that executes nothing exits 0 from xcodebuild, which is why this "
                    f"floor exists rather than a check that some tests ran.")
              bad = True
          if failed:
              print(f"::error::{failed} test(s) failed.")
              bad = True

          sys.exit(1 if bad else 0)
          PY

      # THE OTHER BRANCH, and it must not be able to print what the branch
      # above prints. `IOS_ARCHIVE_NOT_NEEDED` and `IOS_ARCHIVE_OK 2/2 …` are
      # different strings on purpose: a reader who greps the log for either one
      # learns which of the two things happened, and neither can be mistaken
      # for the other.
      - name: Nothing here reaches the iOS build
        if: needs.ios-changes.outputs.ios != 'true'
        run: |
          echo "IOS_ARCHIVE_NOT_NEEDED — no path under apps/ios/ and no change to the gate itself"
          echo "This job took a ${RUNNER_OS} runner and compiled nothing."

  # THE SINGLE CHECK, so the set above can change without renaming a required
  # check every time.
  #
  # `always()` or this is skipped the moment anything upstream fails — and a
  # skipped job reports neutral, not red, so the gate would go quiet exactly
  # when it matters. EVERY job must appear in `needs`: one left out is one
  # whose failure this cannot see.
  #
  # THE FORK GUARD IS REPEATED HERE, AND `always()` IS WHY IT HAS TO BE. On a
  # fork PR every job above is skipped; a bare `always()` would then run this
  # one, find nothing failed, and post a GREEN "Verify passed" for code that
  # was never verified. That is worse than the no-check-at-all this file
  # already chose. With the guard, a fork PR gets no aggregate either.
  #
  # ONLY `success` PASSES. Because the guard above means a skip can no longer
  # be the fork case, any skip reaching here is a job that quietly did not run,
  # and treating it as a pass is how this kind of gate rots. `cancelled` fails
  # for the same reason: a cancelled run is not a verified one.
  #
  # `ios` DOES NOT GET AN EXEMPTION FROM THAT, and it was built so it would not
  # need one (#767). The obvious shape for a path-scoped check — skip the job
  # when nothing relevant changed — would have put a `skipped` in front of this
  # loop on ~95% of pull requests, and the only way through is to teach the
  # loop that a skip is sometimes fine. That is the rule above, weakened, for
  # one job, for ever. Instead `ios` always runs and always reports `success`:
  # on a Linux runner doing nothing when no iOS path changed, on a Mac
  # archiving when one did. So the line below gains two jobs and the rule it
  # enforces is unchanged — which is the point, and the reason the extra Linux
  # runner boot is worth paying for.
  #
  # THE PROPERTY THAT HAS TO HOLD: an iOS file changed and the archive did not
  # run cannot be green. It holds through `ios-changes` being in this list too.
  # If detection fails, `ios` is skipped for want of its output AND
  # `ios-changes` reports `failure` — two reasons this goes red, neither of
  # which depends on anyone having remembered the first one.
  verify-passed:
    name: Verify passed
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [source, typecheck, lint, test, test-engine, macos, electron, ios-changes, ios]
    timeout-minutes: 5
    steps:
      - name: Report the aggregate
        run: |
          set -euo pipefail
          # SINGLE QUOTES INSIDE THE EXPRESSION. GitHub's expression language
          # has no double-quoted string literal, and the whole workflow fails
          # to load if you use one — a jobless failed run with no annotation
          # anywhere in the API, which is a slow thing to diagnose.
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          failed=0
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::Verify did not pass: an upstream job reported '$result'"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "every upstream job succeeded"
