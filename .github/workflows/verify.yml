name: Verify

# Typecheck, lint and test everything that does not need a Mac.
# Rationale, measurements and cost analysis: docs/ci-verification.md
#
# ON THE MAC MINI SINCE 2026-09-11, though nothing here needs a Mac: the
# hosted lane stopped starting jobs (billing) and the Mac was idle. The job
# is unchanged in what it runs — `bun run verify`, in three steps so a red
# lands in the right place. One job, not a matrix, because the runner takes
# one job at a time and a split would only queue.
# No paths-ignore: a filtered-out run never reports, and a required check that
# never reports blocks the PR forever.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# THE REPO IS PUBLIC AND THE RUNNER IS THE OWNER'S MAC (2026-09-17). A
# `pull_request` from a fork checks out and executes the fork's code on that
# Mac. GitHub's approval gate is set to every external contributor, but this
# job also refuses at the job level: only pull requests from branches IN this
# repository run. A fork PR gets no check rather than a run, and the owner
# reviews and re-pushes to a `telar/*` branch if it is wanted.
# `github.event.pull_request.head.repo.full_name` is the fork's name on a fork
# PR and this repo's on a branch PR; a push to main has no pull_request at all.

# CANCELLING IS RIGHT ON A BRANCH AND WRONG ON MAIN — one setting, two refs,
# and it needed splitting rather than choosing between (#687).
#
# On a pull request ref, cancelling is what you want: a new push supersedes the
# commit under test, and a serial runner should not spend minutes proving
# something nobody is waiting on. That half is unchanged.
#
# On `refs/heads/main` the same setting destroys the evidence it was meant to
# produce. Every merge pushes the same ref, joins the same concurrency group,
# and kills the run verifying the PREVIOUS merge. Merge quickly enough and main
# is never proven at all — each merge erases the proof for the one before it.
#
# MEASURED, 2026-09-19: 12 of the last 20 verify runs on main were cancelled —
# 60% — including five consecutively, `fbc250c0` through `4aaa8979`, five
# merges of which not one was verified. The sharpest case is `7b77a276`, the
# merge of #684's SQLite busy-timeout fix: the commit is on main and its own
# verification was cancelled by the next merge, so nothing ever confirmed main
# was green with it. Serialising merges by hand stopped it dead — five clean
# runs in a row — which is what this expression makes automatic rather than
# something a person has to remember.
#
# NOT A RUNNER-LOAD PROBLEM, and the intuitive reading is wrong. Groups never
# span a pull request and main — under the expression below a PR's group is its
# ref and main's is a commit sha, and before it they were two different refs.
# Either way a branch push cannot reach main's run: only a push to
# `refs/heads/main` shares main's group, and only a merge does that. Throttling
# PR pushes buys nothing here; it was verified live that a branch push queues
# behind an in-progress main run rather than killing it.
#
# `cancel-in-progress: false` WAS NOT ENOUGH, and the reason is the whole of
# why this expression looks the way it does. That setting protects a run that
# has STARTED. GitHub separately keeps ONE PENDING RUN PER GROUP, and a newly
# queued run evicts an older QUEUED one no matter what the setting says. On a
# single serial runner "queued" is the common case, not the rare one.
#
# MEASURED after the first fix shipped:
#
#   02cb9c2b  main  00:50:44  in_progress   ← holding the runner
#   e104cf61  main  01:10:35  CANCELLED 01:10:48 — ZERO JOBS, never started
#   fd1662f7  main  01:10:46  pending       ← took the slot
#
# `e104cf61` carried the first fix and was evicted from the pending slot
# thirteen seconds after it was created, with no job ever run. The three main
# runs that DID survive a merge landing on them had all already started, which
# is why the first fix looked complete and was not.
#
# SO EVERY MAIN COMMIT GETS ITS OWN GROUP. A group of one cannot be superseded
# — not in progress, not pending — so every merged commit is verified as
# itself. A green commit means THAT commit, which is the only version of this
# worth having: "which commit broke it" is the question people actually ask.
#
# Pull requests keep the ref as their group and keep cancelling, which is right
# there and unchanged: a new push supersedes the commit under test, and a
# serial runner should not spend minutes proving something nobody waits on.
# A sha can never collide with a ref-shaped group — one is 40 hex, the other
# begins `refs/`.
#
# `A && B || C` IS NOT A TERNARY, and the difference bites here. It yields B
# only when B is TRUTHY; a falsy B falls through to C. So if the middle operand
# could ever be empty, a push would silently land back on the ref group — this
# exact defect, reintroduced invisibly. It cannot: `format('verify-{0}', …)`
# always returns a non-empty string. Verified by evaluating this file's own
# expressions with GitHub's engine (`@actions/expressions`), including that
# substituting an empty middle operand reproduces `verify-refs/heads/main`.
#
# THE COST, stated so nobody trims it back by accident: every main commit now
# queues a run on one serial runner, competing with PR verification — roughly
# 90 minutes at the 22 merges this repo did on 2026-09-19. IF THAT QUEUE
# BECOMES THE BINDING CONSTRAINT, THE ANSWER IS RUNNER CAPACITY OR A CHEAPER
# MAIN JOB — NOT re-introducing a setting that throws the evidence away.
# Reverting this to shorten the queue restores the exact defect #687 records.
# A scheduled verify of main's tip was considered and rejected: it proves the
# tip and leaves every intermediate commit unproven.
#
# IT DID BECOME THE BINDING CONSTRAINT, the same night it shipped. A main run
# that cannot be superseded has exactly one way out of the queue: it runs. That
# is fine until main advances faster than one slot can retire them — and then
# they arrive faster than they leave. They are not stuck, they are backed up:
# `108043c1` sat queued 53 minutes and then went green on its own.
# The queue reached 15 and seven queued main runs had to be cancelled BY HAND
# to let PR checks through. The fix is the third option that paragraph did not
# list — keep every commit's run, and let the newest sweep the ones it has
# superseded. It lives in the job below, not here; a concurrency group cannot
# express "cancel the older ones but not me and not the newest".
concurrency:
  group: ${{ github.event_name == 'push' && format('verify-{0}', github.sha) || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  verify:
    name: Typecheck, lint, and test everything that does not need a Mac
    runs-on: [self-hosted, macOS, ARM64, telar-nightly]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # `actions: write` is for the sweep step below and nothing else. A job-level
    # block REPLACES the workflow-level one rather than adding to it, so
    # `contents: read` is restated here; dropping it would break checkout.
    permissions:
      contents: read
      actions: write
    # Without this a hang would hold the one runner for GitHub's 6-hour
    # default, and every release behind it.
    timeout-minutes: 15
    steps:
      # BOUND THE BACKLOG THIS WORKFLOW CREATES (#687). Per-sha grouping above
      # is why a main run is never superseded, and on a one-slot runner that
      # leaves running as its only way out of the queue. They do get there —
      # the backlog is arrival rate against one slot, not a stall — but under
      # load they arrive faster than they leave and the queue grows without
      # bound. So the newest run sweeps its own predecessors, and the backlog
      # is bounded without any commit losing the run that proves it.
      #
      # WHY A STEP AND NOT A SCHEDULED WORKFLOW. A cron sweeper has to run
      # somewhere. On this Mac it queues behind the jam it exists to clear —
      # useless by construction. `ubuntu-latest` would in fact work, and the
      # header comment above is out of date on this point: hosted runners were
      # refused at dispatch on 2026-09-11 ("recent account payments have
      # failed"), which is why every workflow here moved to the Mac, but that
      # was re-tested on 2026-09-20 and a hosted job started and passed in two
      # seconds. It is still the wrong shape. Cron cannot keep up — a 5-minute
      # floor that GitHub delays further under load, against merges that landed
      # 8 SECONDS apart the same night (`05f498bf`, `f918ef8d`). Scheduled
      # workflows are also disabled after 60 days of repo inactivity, a silent
      # failure mode in a mechanism whose entire job is to prevent one. And a
      # second workflow that also cancels runs doubles the blast radius for a
      # bounded problem. A step inside the run that already owns the slot needs
      # no second runner and no timer.
      #
      # ITS ONE WEAKNESS, stated so nobody is surprised by it: it acts only when
      # a run STARTS, so it cannot clear a jam in which nothing starts. It
      # bounds the steady state — it is not a rescue for a wedged runner.
      #
      # THE BLAST RADIUS IS THE WHOLE DESIGN. This cancels work, so every limit
      # is enforced twice, once in the query and again on each candidate:
      #   * push-to-main runs only — a pull request's check is somebody's gate,
      #     and this must never touch one.
      #   * this workflow only, never "whatever happens to be queued".
      #   * `queued`/`pending` only, never `in_progress`. A started run already
      #     owns the slot, and killing in-flight work is a judgement call a
      #     robot does not get to make.
      #   * strictly lower `run_number` than this run, so the newest always
      #     survives and this run can never cancel itself.
      # A 409 from the cancel is NOT an error: the run left the queue between
      # the list and the cancel, which is the outcome we wanted anyway.
      # `retries` is there so a transient 5xx does not redden main on its own.
      #
      # IT SWEEPS FIRST AND REPORTS LAST, and the split is the point. Both
      # halves of the obvious design are wrong on their own:
      #
      #   * Sweeping here and failing HERE would mean a sweep that cannot reach
      #     the API destroys the commit's verdict — the job dies before running
      #     a single test. That is exactly the harm #687 exists to prevent,
      #     arriving through the mechanism built to prevent it.
      #   * Sweeping at the END of the job instead would protect the verdict,
      #     but `always()` does not cover a CANCELLED job, so a cancelled run
      #     never gets there and never sweeps. Not hypothetical: seven queued
      #     main runs were cancelled by hand on 2026-09-20.
      #
      # So the cancelling happens first, where it always runs, and the verdict
      # on it is deferred to a final `always()` step. A failed sweep turns the
      # job red with the surviving run ids — a sweeper that fails quietly
      # leaves the queue unbounded and nobody finds out until 3am — but the
      # tests still run and still report. Nothing is caught and swallowed:
      # the reason is carried to the end in an output, not discarded.
      #
      # FIRST ALSO BEATS LAST IF THE RUNNER POOL EVER GROWS. On one runner the
      # swept set is identical either way, since nothing else can start while
      # this job holds the only slot. On two, sweeping first frees a superseded
      # run's slot for a PR check; sweeping last lets the second runner pick
      # that superseded run up, at which point it is `in_progress` and
      # correctly spared, having burned four minutes proving a dead commit.
      - name: Cancel superseded main verify runs
        id: sweep
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          retries: 3
          # 409 is the expected race below, not a fault — without it here the
          # retry plugin would spend three attempts re-confirming it.
          retry-exempt-status-codes: 400,401,403,404,409,422
          script: |
            const { owner, repo } = context.repo;
            const selfId = context.runId;
            const selfNumber = context.runNumber;
            const failures = [];

            // Nothing in here may throw: a throw would fail this step and take
            // the commit's verification down with it, which is the whole thing
            // this split exists to avoid. Every reason is collected and handed
            // to the reporting step at the end of the job instead.
            try {
              // Newest first. One page is ample — the backlog that motivated
              // this peaked at 15, and a main run 100 merges back is long done.
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'verify.yml',
                branch: 'main',
                event: 'push',
                per_page: 100,
              });

              // Re-assert every limit the query already applied. If a parameter
              // is ever dropped or its meaning changes, this is what still
              // stops the sweep reaching a pull request or an in-flight run.
              const superseded = data.workflow_runs.filter((r) =>
                r.id !== selfId &&
                r.run_number < selfNumber &&
                (r.status === 'queued' || r.status === 'pending') &&
                r.event === 'push' &&
                r.head_branch === 'main'
              );

              core.info(
                `This run is #${selfNumber} (${selfId}). ` +
                `Superseded main runs still queued: ${superseded.length}.`
              );

              for (const r of superseded) {
                const label = `#${r.run_number} ${r.head_sha.slice(0, 8)} (${r.id}), queued ${r.created_at}`;
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: r.id });
                  core.info(`cancelled ${label}`);
                } catch (err) {
                  if (err.status === 409) {
                    core.info(`left the queue on its own, nothing to cancel: ${label}`);
                    continue;
                  }
                  failures.push(`${label}: ${err.status ?? 'no status'} ${err.message}`);
                }
              }
            } catch (err) {
              // The listing itself failed, or the response was not the shape
              // this expects. Either way no sweep happened at all.
              failures.push(`the sweep did not run: ${err.status ?? 'no status'} ${err.message}`);
            }

            if (failures.length > 0) {
              // `warning` so it is visible the moment it happens; the red comes
              // from the reporting step once the tests have had their turn.
              // One line: this is carried through an output and re-emitted as
              // an `::error::`, and a newline there would truncate it.
              const reason =
                `Could not sweep ${failures.length} superseded main run(s). The queue ` +
                `is NOT bounded right now and may need a hand sweep. ` +
                failures.join(' | ');
              core.warning(reason);
              core.setOutput('failure', reason);
            }

      - uses: actions/checkout@v4

      # No `bun-version:` is a PIN, not an omission — do not "fix" it.
      # setup-bun@v2 with no version reads `packageManager` from package.json,
      # resolving to the declared bun@1.3.11. Naming it here too would create a
      # second place to update and a new way for the two to disagree. Kept on
      # the self-hosted runner too: the service's PATH is the bare system one,
      # and this is what puts bun on it.
      - uses: oven-sh/setup-bun@v2

      # No actions/cache: the runner is a persistent Mac, so ~/.bun/install/cache
      # survives between runs by itself, and a cache action would upload it to
      # GitHub only to download it back.
      - name: Install dependencies
        env:
          # apps/desktop trusts electron's postinstall, which would pull a
          # ~100MB binary this job never boots.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      # These four are exactly `bun run verify` from the repo root, in order,
      # so a red run reproduces with one command locally. Separate steps only so
      # the failure lands in the right place in the log.
      #
      # DELIBERATELY ABSENT: apps/web_old. The legacy cockpit is frozen as a
      # read-only design source for the Telar rebuild and is no longer verified
      # here — no typecheck, no lint ceiling, no test suite. Its lint ceiling
      # (scripts/lint-ceiling.mjs) was deleted with the gate rather than left
      # behind to rot. Do not re-add it: work belongs in apps/web.

      # Cheapest first.
      #
      # DELIBERATELY ABSENT: the packages/core test-tree ceiling. That gate
      # (scripts/typecheck-ceiling.mjs) existed because core's tsconfig excluded
      # its own `test` dir, so 116 test files were never typechecked and could
      # not be made clean in one go. packages/core was deleted with the Loom
      # engine (#501 step 3), and the ceiling went with it rather than being
      # left behind to rot. Every tree that remains typechecks outright.
      # THINGS THAT ARE TRUE OF THE SOURCE TEXT, and they belong on a job with
      # no Mac in it. These read Swift but compile none — asserting them from
      # inside a unit test is the trap #248 and ActivitySegmentsTests both fell
      # into, where `#filePath` resolves to the COMPILING machine's path and so
      # passes on a simulator and throws on a device. Here they gate every PR.
      - name: Check the source invariants
        run: bun run check:source

      - name: Typecheck engine-client, env, engine, and web
        run: bun run typecheck

      - name: Lint apps/web
        run: bun run lint

      # Desktop is the unit tier only. Smoke and e2e need a real Electron and a
      # built bundle, and stay on the mac release path.
      - name: Run the engine-client, env, engine, web, desktop and worker suites
        run: bun run test

      # THE OTHER HALF OF THE SWEEP AT THE TOP OF THIS JOB. The cancelling runs
      # first so it always runs; the verdict on it lands here so a sweep that
      # could not reach the API costs main a red run rather than costing this
      # commit its verification. `always()` so a red test suite above does not
      # hide an unbounded queue, and the guard means a clean sweep — including
      # the common one that found nothing to do — skips silently.
      #
      # The reason goes through `env:` rather than into the `run:` text.
      # Interpolating an API error message straight into a shell script is how
      # a workflow gets an injection, and this one is repeating a string it did
      # not write.
      - name: Fail if the queue sweep did not complete
        if: always() && steps.sweep.outputs.failure != ''
        env:
          SWEEP_FAILURE: ${{ steps.sweep.outputs.failure }}
        run: |
          set -euo pipefail
          printf '::error::%s\n' "$SWEEP_FAILURE"
          exit 1

      # DELIBERATELY ABSENT: `next build`. A reader may assume "Verify" proves
      # the app still builds. It does not. See docs/ci-verification.md.
