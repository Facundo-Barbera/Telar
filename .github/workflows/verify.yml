name: Verify

# Typecheck, lint and test everything that does not need a Mac.
# Rationale, measurements and cost analysis: docs/ci-verification.md
#
# ubuntu-latest, not macos-14: macOS bills at 10x and nothing here needs it.
# One job, not a matrix: billing is the sum of job minutes, each rounded up to
# a whole minute, so a three-way split pays install three times.
# No paths-ignore: a filtered-out run never reports, and a required check that
# never reports blocks the PR forever.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, and test everything that does not need a Mac
    runs-on: ubuntu-latest
    # Projected cold cost ~5 min, worst case ~6.5. Without this a hang would
    # bill GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `bun-version:` is a PIN, not an omission — do not "fix" it.
      # setup-bun@v2 with no version reads `packageManager` from package.json,
      # resolving to the declared bun@1.3.11. Naming it here too would create a
      # second place to update and a new way for the two to disagree.
      - uses: oven-sh/setup-bun@v2

      # Restore and save are SPLIT deliberately — do not collapse into
      # actions/cache@v4, whose post-save is skipped when an earlier step fails.
      # This job exists to fail, and the run that fails is the one that most
      # needs its cache saved. No restore-keys: a prefix fallback would ratchet
      # the archive upward forever.
      - name: Restore Bun's global install cache
        id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        env:
          # apps/desktop trusts electron's postinstall, which would pull a
          # ~100MB binary this job never boots.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Save Bun's global install cache
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # These three are exactly `bun run verify` from the repo root, in order,
      # so a red run reproduces with one command locally. Separate steps only so
      # the failure lands in the right place in the log.
      #
      # DELIBERATELY ABSENT: apps/web_old. The legacy cockpit is frozen as a
      # read-only design source for the Telar rebuild and is no longer verified
      # here — no typecheck, no lint ceiling, no test suite. Its lint ceiling
      # (scripts/lint-ceiling.mjs) was deleted with the gate rather than left
      # behind to rot. Do not re-add it: work belongs in apps/web.

      # Cheapest first. Includes core's test tree, which nothing typechecked
      # until this branch — pinned as a ceiling by scripts/typecheck-ceiling.mjs.
      - name: Typecheck core, engine, web, and core's test tree against its ceiling
        run: bun run typecheck

      - name: Lint apps/web
        run: bun run lint

      # Desktop is the unit tier only. Smoke and e2e need a real Electron and a
      # built bundle, and stay on the mac release path.
      - name: Run the core, engine, web, and desktop unit suites
        run: bun run test

      # DELIBERATELY ABSENT: `next build`. A reader may assume "Verify" proves
      # the app still builds. It does not. See docs/ci-verification.md.
