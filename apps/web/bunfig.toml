# BUN READS bunfig.toml FROM THE DIRECTORY IT WAS INVOKED IN and does not walk
# up to the repo root, so `bun run --cwd apps/web test` — the one CI runs — and
# any bare `bun test` from here see none of the root bunfig.toml. This file is
# that copy for the one workspace whose tests render React; it is not an
# override, so keep the two in step.
[test]
# The first is the per-test ceiling (#740). It used to be `--timeout 20000` on
# the `test` script, which this workspace lost — along with NODE_ENV=test — the
# moment anyone ran a single test file from the repo root instead.
#
# The jsxDEV failure the second repairs only bites .tsx tests, which all live
# here. The third gives this workspace a DOM before any test file imports a UI
# primitive, which is the only moment at which it can be given — see the file.
# The fourth settles the other import-time decision a shared process makes once
# for everybody: the global Next's server modules look for and bun does not
# have.
preload = ["../../scripts/test-ceiling.mjs", "../../scripts/test-setup.mjs", "./scripts/test-dom.mjs", "./scripts/test-async-storage.mjs"]

# Build outputs copy web source, *.test.tsx included. Never run those stale
# copies as part of the source test gate.
pathIgnorePatterns = ["**/release/**", "**/.next-desktop/**"]
