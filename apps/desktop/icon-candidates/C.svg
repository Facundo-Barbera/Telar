<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#302B78"/>
      <stop offset="1" stop-color="#121030"/>
    </linearGradient>
    <radialGradient id="sheen" cx="180" cy="140" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="weft" x1="0" y1="152" x2="0" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7CE7C"/>
      <stop offset="1" stop-color="#D69538"/>
    </linearGradient>
    <linearGradient id="warp" x1="219" y1="0" x2="293" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAAC57"/>
      <stop offset="1" stop-color="#A9662A"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#plate)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- stem (warp thread) — bottom layer -->
  <rect x="219" y="152" width="74" height="232" rx="22" fill="url(#warp)"/>
  <line x1="244" y1="184" x2="244" y2="352" stroke="#7C4A22" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="268" y1="184" x2="268" y2="352" stroke="#7C4A22" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- crossbar (weft thread) — over the stem -->
  <rect x="130" y="152" width="252" height="74" rx="22" fill="url(#weft)"/>
  <line x1="160" y1="177" x2="209" y2="177" stroke="#B87F3B" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="303" y1="177" x2="352" y2="177" stroke="#B87F3B" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="160" y1="201" x2="209" y2="201" stroke="#B87F3B" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="303" y1="201" x2="352" y2="201" stroke="#B87F3B" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- weave joint: stem re-emerges over the crossbar on the right half of the crossing -->
  <path d="M256,152 L271,152 A22,22 0 0 1 293,174 L293,226 L256,226 Z" fill="url(#warp)"/>

  <!-- seam: crisp the over/under boundary at the crossing -->
  <line x1="256" y1="152" x2="256" y2="226" stroke="#5E3416" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
</svg>
