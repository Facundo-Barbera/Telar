<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B3158"/>
      <stop offset="1" stop-color="#161A33"/>
    </linearGradient>
    <linearGradient id="warp" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F1E4"/>
      <stop offset="1" stop-color="#DED5BE"/>
    </linearGradient>
    <linearGradient id="weft" x1="32" y1="256" x2="480" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFB44E"/>
      <stop offset="1" stop-color="#DA8A29"/>
    </linearGradient>
    <radialGradient id="vign" cx="256" cy="215" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#0B0E1E" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0E1E" stop-opacity="0.14"/>
    </radialGradient>
    <linearGradient id="rim" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip">
      <rect x="32" y="32" width="448" height="448" rx="104"/>
    </clipPath>
  </defs>
  <g clip-path="url(#plateClip)">
    <rect x="32" y="32" width="448" height="448" fill="url(#plate)"/>
    <!-- warp: three vertical strands, full bleed -->
    <rect x="110" y="32" width="76" height="448" fill="url(#warp)"/>
    <rect x="218" y="32" width="76" height="448" fill="url(#warp)"/>
    <rect x="326" y="32" width="76" height="448" fill="url(#warp)"/>
    <!-- gap shadows where weft passes over warp -->
    <rect x="218" y="99" width="76" height="98" fill="url(#plate)"/>
    <rect x="110" y="207" width="76" height="98" fill="url(#plate)"/>
    <rect x="326" y="207" width="76" height="98" fill="url(#plate)"/>
    <rect x="218" y="315" width="76" height="98" fill="url(#plate)"/>
    <!-- weft: three horizontal strands, full bleed -->
    <rect x="32" y="110" width="448" height="76" fill="url(#weft)"/>
    <rect x="32" y="218" width="448" height="76" fill="url(#weft)"/>
    <rect x="32" y="326" width="448" height="76" fill="url(#weft)"/>
    <!-- warp passes back over weft: gap shadow + patch (plain weave) -->
    <rect x="99" y="110" width="98" height="76" fill="url(#plate)"/>
    <rect x="110" y="110" width="76" height="76" fill="url(#warp)"/>
    <rect x="315" y="110" width="98" height="76" fill="url(#plate)"/>
    <rect x="326" y="110" width="76" height="76" fill="url(#warp)"/>
    <rect x="207" y="218" width="98" height="76" fill="url(#plate)"/>
    <rect x="218" y="218" width="76" height="76" fill="url(#warp)"/>
    <rect x="99" y="326" width="98" height="76" fill="url(#plate)"/>
    <rect x="110" y="326" width="76" height="76" fill="url(#warp)"/>
    <rect x="315" y="326" width="98" height="76" fill="url(#plate)"/>
    <rect x="326" y="326" width="76" height="76" fill="url(#warp)"/>
    <!-- depth + rim light -->
    <rect x="32" y="32" width="448" height="448" fill="url(#vign)"/>
    <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
</svg>
