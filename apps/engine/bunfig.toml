# THERE IS NO `timeout` KEY HERE, AND THERE CANNOT BE ONE. This file used to
# carry `[test] timeout = 20000` (#414) and it never once applied: `timeout` is
# not part of bunfig.toml's `[test]` table, and bun ignores keys it does not
# recognise without a word. So the engine suite — a real daemon, a worker and
# child processes per test — ran on bun's 5 s default for every day #414 was
# believed to have fixed it, which is why #266 and #458 kept collecting engine
# timeouts afterwards.
#
# The ceiling now lives where bun actually reads it, as `--timeout 20000` on the
# `test` script in package.json; that script's `//test` comment carries the
# rationale. The per-test `eventually`/`until` helpers in test/*.test.ts hold the
# matching 15 s wall-clock bound, so a wait can outlast a loaded runner without
# outlasting the ceiling, and a genuine hang still fails — twenty seconds later
# instead of five.
#
# Verified against bun 1.3.11: a test that sleeps 7 s dies at exactly 5000 ms
# with this file present, and passes under `bun test --timeout 20000`.

[test]
# THE SUITE DOES NOT TALK TO A REAL PROVIDER — issue #532. The preload arms the
# two switches that stop a test spawning `claude`: without them this suite made
# dozens of real model calls per run and left 8.2 GB of Claude Code transcripts
# under ~/.claude/projects. test/no-providers.ts carries the whole story.
#
# bun reads bunfig.toml from the directory it was invoked in and does NOT walk
# up to the repo root, so this registration covers `bun run --cwd apps/engine
# test` and the root bunfig.toml carries its own for a bare `bun test` there.
preload = ["./test/no-providers.ts"]
