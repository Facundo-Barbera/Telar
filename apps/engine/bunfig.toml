# THERE IS NO `timeout` KEY HERE, AND THERE CANNOT BE ONE. This file used to
# carry `[test] timeout = 20000` (#414) and it never once applied: `timeout` is
# not part of bunfig.toml's `[test]` table, and bun ignores keys it does not
# recognise without a word. So the engine suite — a real daemon, a worker and
# child processes per test — ran on bun's 5 s default for every day #414 was
# believed to have fixed it, which is why #266 and #458 kept collecting engine
# timeouts afterwards.
#
# THE CEILING IS STILL NOT A KEY, BUT IT IS NO LONGER ON THE COMMAND LINE (#740).
# It lived as `--timeout 20000` on the `test` script, which covered `bun run
# --cwd apps/engine test` and silently did not cover the `bun test
# apps/engine/test/one.test.ts` a person types from the repo root — 5 s there,
# 20 s in CI, nothing saying so, and four failures misattributed to machine
# contention because 5007 ms reads like a slow machine and is a default ceiling.
# It now lives in `scripts/test-ceiling.mjs`, which `preload` below reaches from
# every directory tests are run out of; that file records what was measured.
#
# AN EXPLICIT `--timeout` STILL WINS, in either direction, and that took work:
# `setDefaultTimeout` from a preload silently beats the flag, so the preload reads
# the flag back off the operating system and stands aside when it finds one. A
# ceiling that ignored a number somebody typed would be this same bug wearing the
# fix's clothes. `TELAR_TEST_TIMEOUT_MS` does the same for a run that cannot pass
# a flag, and a test's own third argument beats both.
#
# The per-test `eventually`/`until` helpers in test/*.test.ts hold the matching
# 15 s wall-clock bound, so a wait can outlast a loaded runner without
# outlasting the ceiling, and a genuine hang still fails — twenty seconds later
# instead of five.

[test]
# THE SUITE DOES NOT TALK TO A REAL PROVIDER — issue #532. The second preload
# arms the two switches that stop a test spawning `claude`: without them this
# suite made dozens of real model calls per run and left 8.2 GB of Claude Code
# transcripts under ~/.claude/projects. test/no-providers.ts carries the whole
# story, and test-ceiling.mjs the ceiling's.
#
# bun reads bunfig.toml from the directory it was invoked in and does NOT walk
# up to the repo root, so this registration covers `bun run --cwd apps/engine
# test` and the root bunfig.toml carries its own for a bare `bun test` there.
preload = ["../../scripts/test-ceiling.mjs", "./test/no-providers.ts"]
