# Loom redesign — story breakdown.
# Flat ids; group names live in titles. Epic numbering is assigned later,
# across all three specs being planned together.

# --- Foundation ---

- id: "1"
  title: "Foundation: service declaration and per-owner leases"
  description: >-
    CAP-11: agents declare services and never spawn them; the supervisor spawns, owns,
    probes, restarts and tears down under a per-owner lease, idempotently. Unbundles
    run-server.ts/supervisor.ts from the verify-only path.
  spec_checkpoint: true
  invoke_dev_with: >-
    PREREQUISITE: the lease primitive and the sessions tree are SPEC-runtime-foundations
    CAP-5 (its story 5). Build the per-owner SERVICE-lease registry by composing over that
    primitive — do NOT generalize runner/lease.ts here and do NOT create
    TELAR_HOME/sessions/<sessionId>/. Two implementations of stale-reclaim is the path by
    which a false done gets issued, which breaches the accept moat. If the primitive is not
    there yet, STOP and say so.
    Implementation seeds are named in verification.md: run-server.ts (startProjectServer,
    startLane, killTree, findFreePort), supervisor.ts. Model the agent-facing tool surface on
    Claude Code's typed event shape (start/progress/notification, stop-by-id), not raw PTY
    polling. Loom-owned service leases live under the canonical per-loom root at
    TELAR_HOME/projects/<id>/looms/<loom-id>/services/<name>.json.

- id: "2"
  title: "Foundation: MapStore, region files, ledger, methodology-as-data"
  description: >-
    CAP-22, CAP-7 and the storage half of CAP-3: one adapter over two backends
    (in-repo | TELAR_HOME), per-region markdown, the proposal ledger, and seats/artifacts/regions
    as declared data. Substrate only — no intake diff and no write-back yet.
  spec_checkpoint: true
  invoke_dev_with: >-
    Ship exactly one built-in methodology, BMAD-derived, expressed through the data mechanism
    rather than hardcoded — the v1 region set is in map-and-storage.md. Epics and stories are
    deliberately not a region. User overrides ride the existing customize.toml +
    _bmad/custom/<name>.toml pattern; do not invent a format.

- id: "3"
  title: "Foundation: Conversation shell carve-out"
  description: >-
    Carve the chat shell out of session-view.tsx at the render seam and add the Marker and
    ApprovalCard primitives, proving it in the demo gallery. No new surfaces here — every later
    chat surface is born on this.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Full plan is conversation-component.md. Its own stated danger is this story: session-view.tsx
    mixes rendering with session lifecycle. Cut only at the render seam and resist improving
    behavior mid-extraction. The shell owns scrolling and streaming; it owns no data fetching and
    no session semantics. Sequencing (per the 2026-07-24 architecture — supersedes the earlier
    ultra-first conciliation note): this story IS Track C, on the critical path from day one.
    The shell contract is frozen in spine AD-12, so downstream tracks build owner adapters
    against demo-gallery fixtures in parallel; only their final wiring waits on this
    migration landing.

# --- The lab ---

- id: "4"
  title: "Lab: verification recipe and the readiness node"
  description: >-
    CAP-4: the recipe as a map region compiling to servers.yaml plus prepare/carry/verify, and the
    node that proves the lab stands up before any build spend. Fail-closed, with degraded modes
    declared at prep time and surfaced before the gate.
  spec_checkpoint: true
  invoke_dev_with: >-
    The parameter grid is recipe-schema.md; recipe.schema.yaml is its machine-readable draft.
    The natural slot is the dead preparing-phase runSetup hook in weave.ts, flag-off in production
    today. Validate prepare steps by actually executing them — docs lied in multiple surveyed
    projects. Start with ozom-gv, whose kickstart.ts is already a recipe in shell form.

- id: "5"
  title: "Lab: heavy-infra scopes, semaphore and data isolation"
  description: >-
    CAP-12: per-service scope project|loom|ephemeral, refcounted project stacks, the fleet
    heavy-infra semaphore, and isolation by tenant-db or mutex-plus-reset from a migration-hash-keyed
    template. Includes the window-concurrency rule keyed on isolation.
  spec_checkpoint: true
  invoke_dev_with: >-
    Labs are leased just-in-time per verify round, not for the loom's lifetime — that is the whole
    point of the borrow model. Data class production means refuse surface-verify, fail closed.
    v1 serializes stock-port collisions rather than rewriting committed port config.

- id: "6"
  title: "Lab: worktree and branch doctrine, lifecycle and disk"
  description: >-
    CAP-10: branch-per-loom, worktree-per-loom mandatory, thread worktrees reaped at land, and
    dependencies cloned copy-on-write from the loom worktree rather than reinstalled per thread.
    The user's primary checkout is never touched.
  spec_checkpoint: true
  invoke_dev_with: >-
    Existing machinery in vcs.ts and the reapOrphanWorktrees safety net in dispatcher.ts inherit
    unchanged — keep the telar-wt- prefix guard, which is what keeps this away from the user's own
    worktrees. Cleanup stays best-effort with one exception: a worktree that held carry files and
    resists removal escalates as dire, naming the path.

- id: "7"
  title: "Lab: two-altitude verification and the per-repo mutex"
  description: >-
    CAP-13: thread-altitude review and checks running always, serviceless, streaming and parallel;
    loom-altitude lab verification behind the hard one-per-repo mutex. Thread rungs double as the
    progress heartbeat.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    The verifier stack is capability-walled today (verifier.ts, verify-thread.ts, critic.ts,
    panel.ts hold no write tools). Extend that wall to the loom-altitude lab agents; never relax it.
    A passing verdict must stay un-self-issuable.

# --- Prepare ---

- id: "8"
  title: "Prepare: decision graph and approval-gated advance"
  description: >-
    CAP-2 and CAP-6: the branching DAG of real sessions that converges into the gate, plus the
    proposal-approval-effect protocol (advance_node, weave_batch, the ack) that is the only way an
    agent moves a node forward.
  spec_checkpoint: true
  invoke_dev_with: >-
    Every node is a session that must happen or be explicitly skipped — never decoration. Graph
    state and node artifacts are loom-private under TELAR_HOME/projects/<id>/looms/<loom-id>/,
    never in-repo. The graph is never rendered inside the originating session's UI.

- id: "9"
  title: "Prepare: intake and the lazy drift diff"
  description: >-
    The intake half of CAP-3: diff intent against the map at main head, spawn planning nodes only
    where drift exists, and pin the map's content hash for the loom's life.
  spec_checkpoint: true
  invoke_dev_with: >-
    How drift is noticed is the session's judgment over intent, the map and the actual repo — not a
    per-region rule table. Diff against main/default-branch head, never a worktree copy. The pin does
    not move for the loom's lifetime; it is the rebase base at land time, not a mutable view.

- id: "10"
  title: "Prepare: the readiness gate room"
  description: >-
    CAP-5: the pan/zoom preparation DAG, node-click inverting proportions into that node's
    conversation, and the gate as a node whose pane carries Accept, Modify on the go, and
    Deny straight to development.
  spec_checkpoint: true
  invoke_dev_with: >-
    Rendering rules are in ux-surfaces.md and the prototype is demo-gallery entry prep-gate-final —
    design source of truth, not production code. Unprovables show first and the degraded-mode ack
    gates Accept. Waking a dormant node is an approval-gated advance_node that grows a new edge.

- id: "11"
  title: "Prepare: birth, detach and the workspace seam"
  description: >-
    CAP-1: premise-plus-context handover, the detach marker and one-line receipt, the simple-task
    boundary below which no loom exists, and the two workspace paths — batch weave seeding the
    graph, and packet handover.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Both workspace paths take a typed handover (premise list + context references), never a read of
    the workspace store — that module's persistence layout is not this spec's to decide. Tasks a loom
    picked up stay editable in the list; an edit posts to the loom's steering channel and nothing locks.
    The steering-channel endpoint is this story's deliverable; the workspace queue renders the
    sent mark (workspace story 5) — no queue UI is built here.

# --- Execute ---

- id: "12"
  title: "Execute: orchestrator ownership and the role wall"
  description: >-
    CAP-8: after the gate the orchestrator owns created-to-delivered, and conductors never touch
    code — no write or edit tools, and a distinct role in the UI.
  spec_checkpoint: true
  invoke_dev_with: >-
    This is a wall, enforced by construction rather than convention. Audit the existing
    dispatcher/weave orchestration paths for write-tool leakage as part of the story, not after it.

- id: "13"
  title: "Execute: flow compile"
  description: >-
    CAP-9: a thread's main agent authors a schema-validated DAG of parallel lanes, dependency edges
    and per-node context manifests, which then executes deterministically.
  spec_checkpoint: true
  invoke_dev_with: >-
    Parallelism is a planning output — interference analysis over shared files and surfaces shapes
    decomposition width. Keep the design law intact: the compiled flow is data executed by
    deterministic control flow, with intelligence at the leaves. Recompile is explicit, bounded and
    audited; the existing pre-written step templates survive as the low-confidence fallback.

- id: "14"
  title: "Execute: park and resume durability"
  description: >-
    CAP-14: execution state durable enough that a loom parks on usage or credit exhaustion or on
    user command, and resumes later without re-running completed work.
  invoke_dev_with: >-
    Resume must work under a different account or provider — the multi-account machinery in
    accounts.ts/login.ts and accountEnv() already exists. The UI shows park state and why.

- id: "15"
  title: "Execute: progress liveness and the escalation audit"
  description: >-
    CAP-15: the orchestrator's advancement heartbeat alongside the supervisor's existing process
    liveness, with a flatline treated as dire even when every process is green.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Includes auditing every existing escalation point against the dire razor — dire means the loom
    has no viable path to advance without the human. Everything else is a window, not a doorbell.
    Pushes are awareness-only; nothing is resolvable from a phone. Children escalate to mediation
    before any human is reached.

# --- Judge ---

- id: "16"
  title: "Judge: the evidence subsystem"
  description: >-
    CAP-16: one subsystem serving accept proof, heartbeat proof-of-life and courtroom forensics —
    provenance-stamped ledger, cited narrative, attempt history with flaky flags, dev/release lab
    grades, and the reality manifest.
  spec_checkpoint: true
  invoke_dev_with: >-
    Uncited claims render as unverified — the citation requirement is the point, not a nicety.
    Evidence inherits its recipe's data class: shared-dev is flagged on the reality manifest and
    never lands in-repo, and evidence is reaped with its loom.

- id: "17"
  title: "Judge: the delivery card"
  description: >-
    CAP-17: the shelf row for fleet-scale skim and the taste-first open card led by the live product
    on its frozen final-verify lane, with the courtroom below the glass.
  invoke_dev_with: >-
    Prototype is demo-gallery entry delivery-final; ux-surfaces.md carries the contract. One shared
    VerdictBar per delivery, used by both the shelf row and the open card. This replaces
    acceptance-panel.tsx.

- id: "18"
  title: "Judge: accept-then-land and the landing queue"
  description: >-
    CAP-18: accept queues a serial landing that rebases onto moved main and re-verifies the same
    contract at release grade before merging, one at a time.
  spec_checkpoint: true
  invoke_dev_with: >-
    A clean rebase with a contract pass lands silently. A landing whose repair modified code surfaces
    a delta note on the done card. A contract failure re-opens repair and knocks only when repair is
    exhausted. Landings verify at dev grade; this accept-gating path is release grade.

- id: "19"
  title: "Judge: boomerang"
  description: >-
    CAP-19: rejection returns the loom to work with feedback rather than discarding it, keeping its
    branch, worktree and recipe so the second attempt is cheap.

- id: "20"
  title: "Judge: map write-back and the collision protocol"
  description: >-
    CAP-21: drift ledger declared on accept, deltas landed serially, mandatory rebase-adapt when head
    moved, semantic contradictions surfaced side-by-side on the accept card, and staleness re-checked
    at land time.
  spec_checkpoint: true
  invoke_dev_with: >-
    No locks anywhere — proposals are the only write path and serial landing the only commit path,
    which is what makes locks unnecessary. Another loom's open proposals are reachable on demand from
    the ledger but never injected into context. Full protocol in map-and-storage.md.

- id: "21"
  title: "Judge: the vision critic"
  description: >-
    CAP-20: an advisory seat judging a delivery against the map's objective and form regions, rendering
    its verdict in the card's courtroom.
  done_checkpoint: true
  invoke_dev_with: >-
    Advisory only. It never gates Accept and never becomes a bypass — the accept moat is unchanged.

# --- Cockpit and fleet ---

- id: "22"
  title: "Surfaces: the loom cockpit"
  description: >-
    CAP-24: Prepare/Execute/Judge act tabs with park and kill, the sealed prep DAG as a frozen receipt,
    the pinned conductor over grouped thread rows, thread drill with streaming transcripts, and the
    WINDOW/LAB/CHATS header trio.
  invoke_dev_with: >-
    Prototypes are demo-gallery entries loom-detail-walkable and loom-detail-walkable-scale; the
    contract is in ux-surfaces.md. Thread rows are always grouped, single group included, and group
    identity comes from the compiled flow's declared lanes — never a free-text label. Tone law: state
    and data only, no doctrine captions.

- id: "23"
  title: "Surfaces: home and fleet triage"
  description: >-
    CAP-23: the graft onto the existing dashboard — Needs-you split into a delivery shelf and verbatim
    parked questions, running rows carrying act chip and evidence age, done-today receipt, hot projects
    with map drift, and the landing-queue strip.
  invoke_dev_with: >-
    A graft, not a replacement: same KPI hero, two-column deck, rails and panel grammar. Prototype is
    demo-gallery entry home-current. Reuse the single status vocabulary in components/looms/status.tsx —
    hue is a quiet state signal, never a highlighter.

- id: "24"
  title: "Prove-run"
  description: >-
    The SPEC success signal, end to end on a real project: born from a session, gated, built on its own
    branch, proven in a borrowed lab, accepted, and landed silently — with the human knocked only where
    the loom truly could not advance.
  done_checkpoint: true
  invoke_dev_with: >-
    The recursive half is the real gate: telar builds telar under a sandboxed TELAR_HOME. Priority
    recipe coverage in order is ozom-gv, orchestrator, then telar itself — see verification.md.
